<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>買出しリクエスト画面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:15px;color:#2a4a55;background:#e8f0f5;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;background:#e8f0f5;min-height:100vh}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px;border-bottom:1px solid #b8d8e8;background:#8fb8c8;position:sticky;top:0;z-index:10;gap:6px}
.header-garden{font-size:15px;font-weight:700;color:#fff;text-align:center;padding:4px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-garden:hover{opacity:.8}
.header-garden>div:first-child{overflow:hidden;text-overflow:ellipsis}
.header-version{font-size:10px;font-weight:500;color:rgba(255,255,255,.8);line-height:1.2;margin-top:1px;display:inline-block;padding:1px 4px}
.header-left{display:flex;justify-content:flex-start}
.header-right{display:flex;justify-content:flex-end}
.mode-btn{font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;font-weight:500}
.mode-btn:hover{background:rgba(255,255,255,.2)}
.mode-btn.active{background:#fff;color:#5a8a9c;border-color:#fff;font-weight:700}
.header-side-btn{font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;font-weight:500}
.header-side-btn:hover{background:rgba(255,255,255,.2)}
.header-side-btn.active{background:#fff;color:#5a8a9c;border-color:#fff;font-weight:700}
.loading-overlay{position:fixed;inset:0;background:rgba(249,246,240,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:12px}
.spinner{width:36px;height:36px;border:3px solid #e8f0f2;border-top-color:#8fb8c8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#5a8a9c}
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:9px 4px;font-size:13px;font-weight:600;border:none;border-radius:12px;background:#d4e6ee;color:#5a8a9c;cursor:pointer;text-align:center;white-space:nowrap}
.tab.active{background:#8fb8c8;color:#fff;box-shadow:0 1px 6px rgba(143,184,200,.3)}
.staff-tabs{padding:12px 16px 0;gap:6px}
.staff-tabs .tab{--c:#5a8a9c;background:#fff;color:var(--c);border:2px solid var(--c);font-size:12px;padding:9px 2px}
.staff-tabs .tab.active{background:var(--c);color:#fff;box-shadow:none;font-weight:700}
.staff-tabs .tab.t-request{--c:#d4607a}

.staff-tabs .tab.t-history{--c:#3f8a5a}
.app{background:transparent}
body[data-view=request]{background:#fbe0e7}
body[data-view=usual]{background:#fbe8d2}
.staff-footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #c8dfe6;z-index:20}
.footer-btn{--c:#d4607a;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border:2px solid transparent;border-radius:12px;background:#fff;color:var(--c);font-size:13px;font-weight:700;cursor:pointer}
.footer-btn .ic{font-size:21px;line-height:1.2}
.footer-btn.t-usual{--c:#d9832e}
.footer-btn.active{background:var(--c);color:#fff}
body[data-view] .app{padding-bottom:110px}
body[data-view] .toast{bottom:92px}
body[data-view=mylist]{background:#e3eff4}
body[data-view=history]{background:#dff0e4}
.section{padding:14px 16px}
.form-card{background:#fffdf8;border:1px solid #e8f0f2;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(143,184,200,.1)}
.form-row{margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
label{display:block;font-size:12px;color:#5a8a9c;margin-bottom:4px}
.req{color:#c0664a}
.opt{font-size:11px;color:#a8c4cc}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid #d4e6ec;border-radius:10px;padding:9px 11px;font-size:14px;background:#fbf9f2;color:#2a4a55;outline:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=url]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:#8fb8c8;background:#fff}
textarea{resize:vertical;min-height:60px}
.sub-input{margin-top:6px;display:none}
.submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:4px}
.submit-btn:hover{opacity:.9}
.submit-btn:active{transform:scale(.99)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.img-area{border:2px dashed #c8dfe6;border-radius:12px;padding:12px;background:#fbf9f2;text-align:center;cursor:pointer;transition:border-color .2s}
.img-area:hover,.img-area.drag-over{border-color:#8fb8c8;background:#eef6f8}
.img-area-text{font-size:13px;color:#a8c4cc;pointer-events:none}
.img-preview-box{position:relative;display:none;margin-top:8px}
.img-preview-box img{width:100%;max-height:130px;object-fit:cover;border-radius:10px;display:block}
.img-clear-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:22px;text-align:center}
input[type=file]{display:none}
.sort-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}
.sort-label{font-size:11px;color:#5a8a9c;margin-bottom:3px}
.sort-bar select{font-size:13px;padding:6px 10px}
.group-block{margin-bottom:16px}
.group-label{font-size:11px;font-weight:700;color:#5a8a9c;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.item-card{background:#fffdf8;border:1.3px solid #c8dfe6;border-radius:12px;padding:11px 12px;display:flex;align-items:stretch;gap:10px;margin-bottom:8px;box-shadow:0 1px 6px rgba(143,184,200,.08)}
.item-card.partial{background:#fff6ec;border-color:#f0d8b0}
.item-card.done{}
.chk{width:22px;height:22px;flex-shrink:0;cursor:pointer;margin-top:2px;accent-color:#8fb8c8;align-self:flex-start}
.img-slot{width:64px;height:64px;flex-shrink:0;border-radius:10px;overflow:hidden;background:#e3eef2;border:1px solid #d4e6ec;display:flex;align-items:center;justify-content:center;align-self:flex-start}
.img-slot img{width:100%;height:100%;object-fit:cover}
.img-slot-empty{font-size:24px;opacity:.35;color:#5a8a9c}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:700;color:#1e3a44;word-break:break-all}
.item-name.done{}
.item-qty{font-size:14px;font-weight:700;color:#1e3a44;margin-top:1px}
.item-qty.done{}
.item-meta{font-size:12px;color:#5a8a9c;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid #e8f0f2;border-radius:8px;background:transparent;cursor:pointer;color:#a8c4cc;font-size:16px;flex-shrink:0}
.icon-btn:hover{background:#eef6f8;color:#5a8a9c}
.actions-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;justify-content:space-between;gap:4px}
.small-btn{font-size:11px;padding:4px 9px;border:none;border-radius:8px;background:#e3eef2;color:#5a8a9c;cursor:pointer;white-space:nowrap;font-weight:600}
.small-btn:hover{background:#d4e6ec}
.edit-btn{font-size:12px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:48px;text-align:center;line-height:1.3}
.edit-btn:hover{opacity:.85}
.hold-btn{font-size:12px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:48px;text-align:center;line-height:1.3}
.hold-btn:hover{opacity:.85}
.rebuy-btn{font-size:13px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#d4937a,#c47a5f);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:52px;text-align:center;line-height:1.3}
.rebuy-btn:hover{opacity:.85}
.revert-btn{font-size:11px;padding:4px 9px;border:none;border-radius:8px;background:#e3eef2;color:#5a8a9c;cursor:pointer;white-space:nowrap;font-weight:600}
.revert-btn:hover{background:#d4e6ec}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.bc-kyozai{background:#d8e8ee;color:#3a7a92}
.bc-shoumou{background:#d0e8d8;color:#1a6a40}
.bc-kyushoku{background:#f0ddc8;color:#a3602a}
.bc-cake{background:#f0ddd0;color:#a3603f}
.bc-torig{background:#e6e2d4;color:#6a6858}
.bc-diy{background:#c8e8dc;color:#0a6a50}
.bc-zappi{background:#e2dce8;color:#5a4a70}
.bc-fukuri{background:#fce8d8;color:#a35a20}
.requester-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0e6d8;color:#9a7a55;font-weight:500}
.qty-alert{font-size:12px;font-weight:700;color:#c0664a}
.partial-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;background:#f0d8b0;color:#a3702a}
.cat-select-inline{border:1px solid #c8dfe6;border-radius:8px;font-size:12px;padding:3px 6px;background:#fbf9f2;color:#2a4a55;width:auto}
.empty{text-align:center;padding:36px 16px;color:#a8c4cc;font-size:13px}
.empty-icon{font-size:36px;display:block;margin-bottom:8px}
.url-link{font-size:11px;color:#6fa0b4;word-break:break-all;text-decoration:none}
.url-link:hover{text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#8fb8c8;color:#fff;font-size:13px;padding:10px 22px;border-radius:20px;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;z-index:200;box-shadow:0 4px 16px rgba(143,184,200,.35)}
.toast.show{opacity:1}
.toast.warn{background:#c9503c;font-weight:700;white-space:normal;width:max-content;max-width:90vw;text-align:center}
.invalid,input.invalid,select.invalid,textarea.invalid{border:2px solid #c9503c!important;background:#fdf0ec!important;border-radius:10px}
.err-banner{background:#fbe8e2;border:1px solid #e0b09c;border-radius:10px;padding:10px 14px;margin:10px 16px 0;font-size:13px;color:#a3502f;display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(42,74,85,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fffdf8;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;color:#8fb8c8;margin-bottom:14px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#a8c4cc;line-height:1}
/* ドラムロールピッカー */
.drum-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.drum-unit-input{width:70px;border:1px solid #d4e6ec;border-radius:10px;padding:8px;font-size:15px;text-align:center;background:#fbf9f2;color:#2a4a55}
.drum-picker{position:relative;width:240px;height:130px;overflow:hidden;border-radius:12px;border:1px solid #d4e6ec;background:#fbf9f2;cursor:grab;margin:0 auto}
.drum-picker::before,.drum-picker::after{content:'';position:absolute;left:0;right:0;height:42px;z-index:2;pointer-events:none}
.drum-picker::before{top:0;background:linear-gradient(to bottom,rgba(249,246,240,.95),rgba(249,246,240,0))}
.drum-picker::after{bottom:0;background:linear-gradient(to top,rgba(249,246,240,.95),rgba(249,246,240,0))}
.drum-highlight{position:absolute;top:50%;left:0;right:0;height:42px;transform:translateY(-50%);border-top:2px solid #8fb8c8;border-bottom:2px solid #8fb8c8;border-radius:4px;pointer-events:none;z-index:1}
.drum-list{position:absolute;top:0;left:0;right:0;transition:transform .15s cubic-bezier(.25,.46,.45,.94)}
.drum-item{height:42px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#a8c4cc;user-select:none}
.drum-item.selected{color:#8fb8c8;font-size:26px}
.drum-label{font-size:12px;color:#5a8a9c;text-align:center;margin-top:2px}
/* 画像拡大ライトボックス */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:lb-in .2s ease}
@keyframes lb-in{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain;transition:transform .05s linear;will-change:transform}
.lightbox-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.3)}

/* 園選択オーバーレイ */
.garden-overlay{position:fixed;inset:0;background:#f9f6f0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.garden-overlay h2{font-size:20px;font-weight:700;color:#2a4a55;margin-bottom:8px;text-align:center}
.garden-overlay p{font-size:13px;color:#5a8a9c;margin-bottom:32px;text-align:center}
.garden-btn{width:100%;max-width:340px;padding:16px;margin-bottom:12px;border:2px solid #d4e6ec;border-radius:16px;background:#fff;font-size:16px;font-weight:600;color:#2a4a55;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(143,184,200,.1);transition:all .15s}
.garden-btn:hover{border-color:#8fb8c8;background:#eef6f8;transform:translateX(4px)}
.garden-btn .g-icon{font-size:24px}
.garden-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:#e3eef2;color:#5a8a9c;font-weight:600;margin-left:8px;vertical-align:middle}

/* フォルダタブ */
.folder-bar{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.folder-bar::-webkit-scrollbar{display:none}
.folder-chip{font-size:12px;padding:5px 14px;border-radius:20px;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:500;background:#d4e6ee;color:#5a8a9c}
.folder-chip.active{background:#8fb8c8;color:#fff;font-weight:700}
.folder-chip.add-btn{background:#fff;border:1.5px dashed #8fb8c8;color:#5a8a9c}
.folder-chip.add-btn:hover{background:#eef6f8}
.folder-del{font-size:10px;margin-left:4px;opacity:.7;cursor:pointer}
.folder-del:hover{opacity:1}

.action-bar{display:flex;gap:6px;padding:8px 16px;align-items:center;background:#d4e6ee;border-bottom:1px solid #b8d4e4;flex-wrap:wrap}
.action-bar-btn{font-size:12px;padding:5px 14px;border:none;border-radius:20px;cursor:pointer;font-weight:600;white-space:nowrap}
.sel-count{font-size:12px;color:#2a4a55;font-weight:600;flex:1}
.csv-btn{background:#e3eef2;color:#3a7a9c;border:1px solid #b8d4e4}
.csv-btn:hover{background:#d4e6ee}
.move-folder-btn{background:#e3eef2;color:#3a7a9c;border:1px solid #b8d4e4}
.move-folder-btn:hover{background:#d4e6ee}
.clear-sel-btn{background:#fff;color:#5a8a9c;border:1px solid #b8d4e4}
.clear-sel-btn:hover{background:#eef6f8}
.buy-btn{font-size:13px;padding:26px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#e88fa8,#d4607a);color:#fff;cursor:pointer;font-weight:700;text-align:center;line-height:1.4;width:48px;display:flex;align-items:center;justify-content:center}
.buy-btn:hover{opacity:.85}

.img-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0}

.master-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #e8f0f2;background:#fffdf8}
.master-row.dragging{opacity:.6;background:#eef6f8;box-shadow:0 4px 12px rgba(143,184,200,.3);border-radius:8px;z-index:10;position:relative}
.master-row-left{display:flex;align-items:center;gap:8px}
.drag-handle{cursor:grab;color:#c8dfe6;font-size:16px;padding:4px;touch-action:none}
.drag-handle:active{cursor:grabbing}

.pull-refresh-indicator{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-50px);
  background:#fff;color:#5a8a9c;font-size:12px;font-weight:600;padding:8px 18px;border-radius:20px;
  box-shadow:0 2px 10px rgba(143,184,200,.3);z-index:400;opacity:0;transition:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.pull-refresh-indicator .spin{width:14px;height:14px;border:2px solid #d4e6ec;border-top-color:#8fb8c8;border-radius:50%;display:inline-block}
.pull-refresh-indicator .spin.active{animation:spin .7s linear infinite}

.item-card.ordered{background:#e2f4ec;border:2px solid #3f9a78}
.ordered-badge{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:#2f8f6c;border-radius:8px;padding:3px 10px;margin-bottom:4px}
.ordered-date{font-size:11px;font-weight:700;color:#2f7f60;margin-top:3px}
.buy-btn.order{background:linear-gradient(135deg,#f0b860,#d9963a)}
.buy-btn.receive{background:linear-gradient(135deg,#5fb893,#3f9a78)}
.net-toggle{font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #c8dfe6;background:#fff;color:#7a98a2;cursor:pointer;white-space:nowrap}
.net-toggle.on{background:#e2f4ec;border-color:#3f9a78;color:#2f7f60;font-weight:700}
.net-toggle:disabled{cursor:default}
/* 色・サイズなどの選択肢 */
.opt-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.opt-pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:7px;background:#d8e8ee;color:#2f6a80}
.opt-list{margin-top:5px;border:1px solid #c8dfe6;border-radius:8px;overflow:hidden;background:#fff}
.opt-list-row{display:flex;justify-content:space-between;gap:10px;padding:4px 9px;font-size:13px;font-weight:600;color:#2a4a55;word-break:break-all}
.opt-list-row+.opt-list-row{border-top:1px solid #e3eef2}
.opt-list-qty{flex-shrink:0;color:#2f6a80;font-weight:700}
.buy-btn.usual-go-btn{width:64px;padding:12px 4px;font-size:12px;line-height:1.35;background:#d4607a}
.opt-row label{flex-wrap:wrap}
.opt-status{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:#fbe9c8;color:#8a5a12;white-space:nowrap}
.opt-status.ordered{background:#d3efe2;color:#22704f}
.opt-status.recent{background:#dfe6f5;color:#34508a}
.dup-banner{background:#fbe9c8;color:#7a4f10;font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px;margin-bottom:12px;line-height:1.5}
.opt-edit-row{gap:6px}
.opt-edit-row input{min-width:0}
.opt-add-chip{font-size:11px;margin-top:5px;padding:3px 10px;border:1px dashed #8fb8c8;border-radius:20px;background:transparent;color:#5a8a9c;cursor:pointer}
.opt-kinds{display:flex;flex-wrap:wrap;gap:6px}
.opt-kind{font-size:13px;padding:5px 12px;border:1px solid #c8dfe6;border-radius:20px;background:#fff;color:#5a8a9c;cursor:pointer}
.opt-kind.active{background:#8fb8c8;border-color:#8fb8c8;color:#fff;font-weight:700}
.opt-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.opt-chip{font-size:13px;padding:3px 6px 3px 10px;border-radius:20px;background:#e3eef2;color:#2a4a55;display:inline-flex;align-items:center;gap:2px}
.opt-chip button{border:none;background:none;color:#5a8a9c;font-size:13px;cursor:pointer;padding:0 4px}

/* デザイン切り替えボタン */

/* ── 買出し画面：黒革×真鍮×液晶（body.theme-leather のときだけ効く） ── */

.theme-leather .header{background:#100f0d;border-bottom:1px solid #b08f55}

/* 液晶パネル */

/* フォルダ・ソート・見出し */

/* カード（紙） */

/* ボタン：インクの押印 */

<body>
<div id="garden-overlay" class="garden-overlay" style="display:none">
  <div style="font-size:48px;margin-bottom:16px">🛒</div>
  <h2>買出しリクエスト</h2>
  <p>使用する園を選択してください</p>
  <button class="garden-btn" onclick="selectGarden('西新こども保育園')"><span class="g-icon">🌸</span>西新こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('原こども保育園')"><span class="g-icon">🌿</span>原こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('たの津こども保育園')"><span class="g-icon">🌊</span>たの津こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('ちくし野こども保育園')"><span class="g-icon">🌾</span>ちくし野こども保育園</button>
</div>
<div class="pull-refresh-indicator" id="pull-refresh-indicator"><span class="spin" id="pull-refresh-spin"></span><span id="pull-refresh-text">引っ張って更新</span></div>
<div class="app">
  <div class="header">
    <div class="header-left">
      <button class="header-side-btn" id="staff-btn" onclick="goStaff()">リクエスト画面</button>
    </div>
    <div class="header-garden" onclick="changeGarden()">
      <div id="header-garden">園を選択してください</div>
      <div class="header-version" id="header-version" onclick="checkVersionNow(event)"></div>
    </div>
    <div class="header-right">
      <button class="mode-btn" id="mode-toggle" onclick="goAdmin()">買出し画面</button>
    </div>
  </div>
  <div id="err-banner" class="err-banner"></div>
  <div id="staff-view"></div>
  <div id="admin-view" style="display:none"></div>
  <div id="modal-container"></div>
  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loading" style="display:none">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">読み込み中…</div>
  </div>
</div>

<script>
const APP_VERSION='2026-10-31-17'; // 更新時にこの値を変えると新バージョン検知に使えます
const GAS_URL='https://script.google.com/macros/s/AKfycbygPEd4lQT2YPtNSolSbp7HhBD7ATbXzUrWU0HCBsSsY-jKUAP6w72K_kXU2yGeRkmkWQ/exec';
let currentGarden=localStorage.getItem('kaidashi_garden')||'';
let folders=[];
let selectedItems=new Set(); // 選択中のアイテムID
let currentFolder='all'; // ''=通常（全フォルダ外）、'all'=全て表示、フォルダID=特定フォルダ
const CATS=[
  {id:'kyozai',label:'保育教材費'},
  {id:'shoumou',label:'消耗品'},
  {id:'kyushoku',label:'給食費'},
  {id:'cake',label:'誕生日ケーキ'},
  {id:'torig',label:'トリグ（お米）'},
  {id:'diy',label:'DIY'},
  {id:'fukuri',label:'福利厚生費'},
  {id:'zappi',label:'雑費'},
];
const DEFAULT_PLACES=['ダイソー','セリア','ドラッグストア','ホームセンター','文房具店','Amazon','ネット注文'];
const DEFAULT_NET_PLACES=['Amazon','ネット注文']; // 常にネット注文扱いの店

let pending=[],done=[],masterRequesters=[],masterPlaces=[],masterNetPlaces=[];
let mode='staff',staffTab='mylist',adminTab='pending';
let sortKey1='place',sortKey2='cat';
let hold=[];
let holdSort1='date',holdSort2='none';
let staffListSort1='date',staffListSort2='none';
let usualItems=[];
let usualSort1='place',usualSort2='none';
let doneSort1='date',doneSort2='none';
let filterCat='all',filterPlace='all';

/* ── ローディング ─── */
function showLoading(msg='処理中…'){document.getElementById('loading-text').textContent=msg;document.getElementById('loading').style.display='flex';}
function hideLoading(){document.getElementById('loading').style.display='none';}
function showErr(msg){const b=document.getElementById('err-banner');b.textContent='!! '+msg;b.style.display='block';setTimeout(()=>b.style.display='none',6000);}
function showGardenOverlay(){
  document.getElementById('garden-overlay').style.display='flex';
}
function hideGardenOverlay(){
  document.getElementById('garden-overlay').style.display='none';
}
function selectGarden(name){
  const prev=currentGarden;
  currentGarden=name;
  localStorage.setItem('kaidashi_garden',name);
  hideGardenOverlay();
  updateGardenHeader();
  // 園が変わったらデータを再読み込み
  if(prev!==name){
    pending=[];done=[];hold=[];masterRequesters=[];masterPlaces=[];masterNetPlaces=[];
    staffTab='mylist';adminTab='pending';
    loadAllFast().then(fromCache=>{
      rerenderKeepingForm();
      if(fromCache)loadAll(true).then(changed=>{if(changed)rerenderKeepingForm();});
    });
  }
}
function updateGardenHeader(){
  const el=document.getElementById('header-garden');
  if(el) el.textContent=currentGarden||'園を選択してください';
  const ver=document.getElementById('header-version');
  if(ver) ver.textContent='ver '+APP_VERSION;
  const staffBtn=document.getElementById('staff-btn');
  const adminBtn=document.getElementById('mode-toggle');
  if(staffBtn){
    staffBtn.classList.toggle('active', mode==='staff');
  }
  if(adminBtn){
    adminBtn.classList.toggle('active', mode==='admin');
  }
}
function changeGarden(){
  showGardenOverlay();
}

let toastTimer=null;
function showToast(msg,warn=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.toggle('warn',warn);t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),warn?4000:2400);
}
// 必須項目のチェック。[欠けているか, 欄のid, 項目名] を受け取り、未入力の欄を赤くして警告する。未入力があれば true
function warnRequired(checks){
  document.querySelectorAll('.invalid').forEach(el=>el.classList.remove('invalid'));
  const missing=checks.filter(c=>c[0]);
  if(!missing.length)return false;
  missing.forEach(([,id])=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.classList.add('invalid');
    const clear=()=>el.classList.remove('invalid');
    el.addEventListener('input',clear,{once:true});
    el.addEventListener('change',clear,{once:true});
  });
  const first=document.getElementById(missing[0][1]);
  if(first){first.scrollIntoView({block:'center',behavior:'smooth'});if(first.focus)first.focus({preventScroll:true});}
  showToast('⚠ 必須項目が未入力です：'+missing.map(c=>c[2]).join('・'),true);
  return true;
}
// 「新しい名前を入力」を選んでいるときは入力欄を、それ以外はプルダウンを指す
function selectFieldId(id){return document.getElementById(id)?.value==='__new__'?id+'-new':id;}

/* ── API ─── */
async function apiGet(){
  const res=await fetch(GAS_URL+'?action=getAll&garden='+encodeURIComponent(currentGarden)+'&t='+Date.now(),{redirect:'follow'});
  return JSON.parse(await res.text());
}
async function apiPost(payload){
  const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  const text=await res.text();
  try{return JSON.parse(text);}catch(e){console.error('Parse error:',text);throw new Error('レスポンスの解析に失敗');}
}
function applyData(d){
  pending=d.pending||[];done=d.done||[];hold=d.hold||[];folders=d.folders||[];usualItems=d.usualItems||[];
  masterRequesters=d.masters?.requesters||[];masterPlaces=d.masters?.places||[];masterNetPlaces=d.masters?.netPlaces||[];
}
// 前回取得したデータを園ごとに端末へ保存し、次回の起動時にすぐ表示する
const DATA_CACHE_PREFIX='kaidashi_cache_v1:';
function saveDataCache(garden,d){
  try{localStorage.setItem(DATA_CACHE_PREFIX+garden,typeof d==='string'?d:JSON.stringify(d));}
  catch(e){try{localStorage.removeItem(DATA_CACHE_PREFIX+garden);}catch(e2){}}
}
function loadDataCache(garden){
  try{const s=localStorage.getItem(DATA_CACHE_PREFIX+garden);return s?JSON.parse(s):null;}
  catch(e){return null;}
}
async function loadAll(silent=false){
  if(!currentGarden)return; // 園が未選択のときは全園分を取りに行かない
  const garden=currentGarden;
  if(!silent)showLoading('データを読み込み中…');
  try{
    const d=await apiGet();
    if(garden!==currentGarden)return false; // 読み込み中に園が切り替わった
    const json=JSON.stringify(d);
    let changed=true;
    try{changed=localStorage.getItem(DATA_CACHE_PREFIX+garden)!==json;}catch(e){}
    applyData(d);
    if(changed)saveDataCache(garden,json);
    return changed;
  }catch(e){console.error(e);if(!silent)showErr('読み込み失敗: '+e.message);return false;}
  finally{if(!silent)hideLoading();renderModeBtn();}
}
// 保存済みデータがあれば即表示して裏で最新化、無ければ通常どおり読み込み画面を出す
async function loadAllFast(){
  const cached=loadDataCache(currentGarden);
  if(!cached){await loadAll();return false;}
  applyData(cached);
  renderModeBtn();
  return true;
}
function rerenderKeepingForm(){
  if(mode==='staff'){
    const preserved=captureRequestFormState();
    renderStaff();
    restoreRequestFormState(preserved);
  }else renderAdmin();
}

/* ── ユーティリティ ─── */
function getCatLabel(id){const c=CATS.find(c=>c.id===id);return c?c.label:id}
function getCatClass(id){return'bc-'+(id||'zappi')}
function allPlaces(){return[...masterPlaces,...DEFAULT_PLACES.filter(p=>!masterPlaces.includes(p))]}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(s){
  if(!s)return'';
  const d=new Date(s);
  if(isNaN(d.getTime())){
    // "2026/5/22"や"2026年5月22日"形式をパース
    const m=String(s).match(/(\d{4})[^\d](\d{1,2})[^\d](\d{1,2})/);
    if(!m)return s;
    const d2=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    if(isNaN(d2.getTime()))return s;
    return d2.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  }
  return d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}
function shortUrl(u){try{const x=new URL(u);return x.hostname+(x.pathname.length>1?x.pathname.slice(0,20)+'…':'');}catch{return String(u).slice(0,28)+'…'}}

/* ── モード切替 ─── */
function renderModeBtn(){
  const btn=document.getElementById('mode-toggle');

function exportCSV(){
  const items=filterByFolder(pending);
  if(!items.length){showToast('出力するアイテムがありません');return;}
  const folderName=currentFolder==='all'?'すべて':currentFolder===''?'通常':getFolderName_safe();
  const headers=['品名','個数','経費','購入場所','依頼者','メモ','URL','依頼日'];
  const NL=String.fromCharCode(10);
  const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const headerRow=headers.map(q).join(',');
  const dataRows=items.map(i=>[i.name,parseOptions(i)?`${i.qty}（${optionsText(parseOptions(i))}）`:i.qty,getCatLabel(i.cat||'zappi'),i.place,i.requester,i.memo,i.url,fmtDate(i.created)].map(q).join(','));
  const csv='\uFEFF'+[headerRow,...dataRows].join(NL);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=new Date().toLocaleDateString('ja-JP');
  a.download='買出しリスト_'+currentGarden+'_'+folderName+'_'+d+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}
function getFolderName_safe(){

  let arr=pending, arrName='pending';
  let idx=pending.findIndex(i=>i.id===id);
  if(idx<0){idx=done.findIndex(i=>i.id===id);arr=done;arrName='done';}
  if(idx<0){idx=hold.findIndex(i=>i.id===id);arr=hold;arrName='hold';}
  if(idx<0)return;
  const oldPlace=arr[idx].place;
  arr[idx]={...arr[idx],place:newPlace};
  if(newPlace&&!allPlaces().includes(newPlace))masterPlaces.push(newPlace);
  renderAdmin();
  const action=arrName==='pending'?'updateItem':arrName==='done'?'updateDoneItem':'updateHoldItem';
  try{await apiPost({action:'updateItem',id:String(id),fields:{place:newPlace},sheet:arrName});}
  catch(e){arr[idx]={...arr[idx],place:oldPlace};renderAdmin();showErr('更新失敗: '+e.message);}
}

/* ════ 画像ヘルパー ════ */
function setupImgArea(areaId,inputId,previewBoxId,previewImgId){
  const area=document.getElementById(areaId);
  const input=document.getElementById(inputId);
  if(!area||!input)return;
  area.addEventListener('click',()=>input.click());
  area.addEventListener('dragover',e=>{e.preventDefault();area.classList.add('drag-over');});
  area.addEventListener('dragleave',()=>area.classList.remove('drag-over'));
  area.addEventListener('drop',e=>{e.preventDefault();area.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)loadImgFile(f,previewBoxId,previewImgId);});
  // クリップボードペースト（ページ全体で受け取る）
  document.addEventListener('paste',e=>{
    if(!document.getElementById(areaId))return;
    const items=e.clipboardData?.items;
    if(!items)return;
    for(const item of items){if(item.type.startsWith('image/')){loadImgFile(item.getAsFile(),previewBoxId,previewImgId);break;}}
  });
  input.addEventListener('change',()=>{if(input.files[0])loadImgFile(input.files[0],previewBoxId,previewImgId);});
}
function loadImgFile(file,previewBoxId,previewImgId){
  const reader=new FileReader();
  reader.onload=e=>{
    const src=e.target.result;
    // サムネイル（カード一覧用・セルに直接保存）とフル画像（imagesシートに分割保存）を両方作る
    compressImage(src,THUMB_STEPS,THUMB_MAX_CHARS,thumb=>{
      compressImage(src,FULL_STEPS,FULL_MAX_CHARS,full=>{
        const box=document.getElementById(previewBoxId);
        const img=document.getElementById(previewImgId);
        if(box&&img){img.src=thumb;img.dataset.full=full;img.dataset.fullId='';img.dataset.changed='1';box.style.display='block';}
      });
    });
  };
  reader.readAsDataURL(file);
}

// サムネイル：長辺200px以下・6,000文字以内（カードの画像枠は64px角）
const THUMB_MAX_CHARS=6000;
const THUMB_STEPS=[[200,0.6],[180,0.55],[160,0.5],[140,0.45],[120,0.4],[100,0.35]];
// 以前の大きなサムネイルを、起動のたびに少しずつ縮めて保存し直す（高画質版がある画像のみ）
const THUMB_SHRINK_PER_LAUNCH=5;
async function shrinkOldThumbs(){
  const garden=currentGarden;
  const targets=[];
  Object.entries({pending,done,hold,usualItems}).forEach(([sheet,list])=>{
    list.forEach(item=>{if(item.imgFull&&item.img&&item.img.length>THUMB_MAX_CHARS)targets.push({item,sheet});});
  });
  try{
    for(const {item,sheet} of targets.slice(0,THUMB_SHRINK_PER_LAUNCH)){
      if(garden!==currentGarden)return;
      const thumb=await new Promise(res=>compressImage(item.img,THUMB_STEPS,THUMB_MAX_CHARS,res));
      if(thumb.length>=item.img.length)continue;
      const fields={img:thumb};
      await apiPost(sheet==='usualItems'
        ?{action:'updateUsualItem',id:String(item.id),fields}
        :{action:'updateItem',id:String(item.id),fields,sheet});
      item.img=thumb;
      document.querySelectorAll(`[data-thumb="${item.id}"]`).forEach(el=>{el.innerHTML=`<img src="${thumb}" alt="">`;});
    }
  }catch(e){console.warn('サムネイルの縮小に失敗',e);}
}
// フル画像：長辺1600px・品質0.85を基本に、大きすぎる場合だけ段階的に落とす（GAS側で40,000文字ずつ分割保存）
const FULL_MAX_CHARS=600000;
const FULL_STEPS=[[1600,0.85],[1600,0.78],[1400,0.75],[1200,0.72],[1024,0.7]];
function compressImage(dataUrl, steps, maxChars, callback){
  const img=new Image();
  img.onload=()=>{
    const render=(size,q)=>{
      let w=img.width, h=img.height;
      if(w>size||h>size){
        if(w>h){h=Math.round(h*size/w);w=size;}
        else{w=Math.round(w*size/h);h=size;}
      }
      const canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); // 透過PNGの背景が黒くならないように
      ctx.drawImage(img,0,0,w,h);
      return canvas.toDataURL('image/jpeg',q);
    };
    // 大きい・高画質から順に試し、上限に収まった時点で採用
    let out='';
    for(const [size,q] of steps){
      out=render(size,q);
      if(out.length<=maxChars)break;
    }
    callback(out);
  };
  img.src=dataUrl;
}
function clearImg(previewBoxId,previewImgId,inputId){
  const box=document.getElementById(previewBoxId);const img=document.getElementById(previewImgId);const inp=document.getElementById(inputId);
  if(box)box.style.display='none';if(img){img.src='';img.dataset.full='';img.dataset.fullId='';img.dataset.changed='1';}if(inp)inp.value='';
}
// 編集フォーム用：画像を触っていなければ {} を返して既存の画像（サムネイル無しの旧画像も含む）を保持
async function imgFieldsFromForm(previewImgId){

// サムネイルは無いが画像はあるアイテムの、編集フォームでのプレビュー
const IMG_PLACEHOLDER='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="130"><rect width="100%" height="100%" fill="#e3eef2"/><text x="50%" y="55%" text-anchor="middle" font-size="15" fill="#5a8a9c">🖼 登録済みの画像</text></svg>');
function hasAnyImg(i){return!!(i.img||i.imgFull||i.imgBig);}
function editPreviewSrc(i){return i.img||(hasAnyImg(i)?IMG_PLACEHOLDER:'');}
function getImgData(previewImgId){
  const img=document.getElementById(previewImgId);
  return(img&&img.src&&img.src.startsWith('data:'))?img.src:'';
}
// フォームのフル画像を確定させて imgFull（画像ID）を返す
// 新しく選んだ画像があれば imagesシートへ保存。画像を外した場合は ''、変更なしなら既存IDをそのまま返す
async function resolveImgFull(previewImgId){
  const img=document.getElementById(previewImgId);
  if(!img||!getImgData(previewImgId))return'';
  if(img.dataset.full){
    const id=newImgId();
    const res=await apiPost({action:'saveImage',id,data:img.dataset.full,garden:currentGarden});
    if(!res||res.ok===false)throw new Error((res&&res.error)||'画像の保存に失敗');
    fullImgCache[id]=img.dataset.full;
    img.dataset.full='';img.dataset.fullId=id; // 二重保存防止
    return id;
  }
  return img.dataset.fullId||'';
}
// ※アイテム削除・画像差し替え時の古い画像チャンクはGAS側で自動削除
const fullImgCache={};
async function fetchFullImage(id){
  if(fullImgCache[id])return fullImgCache[id];
  const res=await fetch(GAS_URL+'?action=getImage&id='+encodeURIComponent(id)+'&t='+Date.now(),{redirect:'follow'});
  const d=JSON.parse(await res.text());
  if(!d||!d.data)throw new Error('画像がありません');
  fullImgCache[id]=d.data;
  return d.data;
}
function newImgId(){return'img'+Date.now()+Math.random().toString(36).slice(2,7);}
// 旧方式の大きな画像（起動時の一覧からは外してある）をセルから直接取得
async function fetchLegacyImage(sheet,id){
  const key='legacy:'+sheet+':'+id;
  if(fullImgCache[key])return fullImgCache[key];
  const res=await fetch(GAS_URL+'?action=getItemImg&sheet='+encodeURIComponent(sheet)+'&id='+encodeURIComponent(id)+'&t='+Date.now(),{redirect:'follow'});
  const d=JSON.parse(await res.text());
  if(!d||!d.data)throw new Error('画像がありません');
  fullImgCache[key]=d.data;
  return d.data;
}

function openItemImage(id,sheet){

  const item=list.find(i=>i.id===id);
  if(!item)return;
  const load=item.imgFull?()=>fetchFullImage(item.imgFull)

    :null;
  openLightbox(item.img,load&&(()=>load().then(data=>{healThumb(item,sheet,data);return data;})));

// サムネイルが無いアイテムは、拡大時に取得した画像からサムネイルを作って保存し直す
// 旧方式（imgFull無し）の場合は、元画像もフル画像として images シートへ移す
const healingIds=new Set();
function healThumb(item,sheet,full){
  if(item.img||healingIds.has(item.id))return;
  healingIds.add(item.id);
  compressImage(full,THUMB_STEPS,THUMB_MAX_CHARS,async thumb=>{
    try{
      const fields={img:thumb};
      if(!item.imgFull){
        const imgId=newImgId();
        const res=await apiPost({action:'saveImage',id:imgId,data:full,garden:currentGarden});
        if(!res||res.ok===false)throw new Error((res&&res.error)||'画像の保存に失敗');
        fullImgCache[imgId]=full;
        fields.imgFull=imgId;
      }
      await apiPost(sheet==='usualItems'
        ?{action:'updateUsualItem',id:String(item.id),fields}
        :{action:'updateItem',id:String(item.id),fields,sheet});
      Object.assign(item,fields);delete item.imgBig;
      document.querySelectorAll(`[data-thumb="${item.id}"]`).forEach(el=>{el.innerHTML=`<img src="${thumb}" alt="">`;});
    }catch(e){console.warn('サムネイルの再作成に失敗',e);}
    finally{healingIds.delete(item.id);}
  });
}

function captureRequestFormState(){
  if(!(mode==='staff'&&staffTab==='request'))return null;
  const ids=['f-requester','f-requester-new','f-name','f-qty','f-place','f-place-new','f-url','f-memo','f-folder'];
  const state={};
  let hasValue=false;
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el){state[id]=el.value;if(el.value)hasValue=true;}
  });
  const imgPreview=document.getElementById('f-img-preview');
  if(imgPreview&&imgPreview.src&&imgPreview.src.startsWith('data:')){state.__img=imgPreview.src;state.__imgFull=imgPreview.dataset.full||'';hasValue=true;}
  return hasValue?state:null;
}
function restoreRequestFormState(state){
  if(!state)return;
  Object.entries(state).forEach(([id,val])=>{
    if(id==='__img'){
      const box=document.getElementById('img-preview-box');
      const img=document.getElementById('f-img-preview');
      if(img){img.src=val;img.dataset.full=state.__imgFull||'';if(box)box.style.display='block';}
      return;
    }
    if(id==='__imgFull')return;
    const el=document.getElementById(id);
    if(el)el.value=val;
  });
  if(typeof onRequesterChange==='function')onRequesterChange();
  if(typeof onPlaceChange==='function')onPlaceChange();
}

/* ════ 色・サイズなどの選択肢 ════
   定番：optionLabel（色など）/ optionList（選択肢のJSON配列）/ unit（袋など）
   依頼：options（{label,unit,usualId,items:[{name,qty}]} のJSON）。qty には合計（8袋）を入れる */
const OPT_KINDS=['色','サイズ'];
const OPT_UNITS=['個','袋','枚','本','箱','セット'];
function parseOptions(i){
  if(!i||!i.options)return null;
  try{const o=JSON.parse(i.options);return o&&Array.isArray(o.items)?o:null;}catch(e){return null;}
}
function usualOptList(u){
  try{const l=JSON.parse(u.optionList||'[]');return Array.isArray(l)?l:[];}catch(e){return[];}
}
function optTotal(items,unit){return items.reduce((s,x)=>s+x.qty,0)+unit;}
function optionsJSON(o,items){return JSON.stringify({label:o.label,unit:o.unit,usualId:o.usualId||'',items});}
function optionsText(o){return o.items.map(x=>`${x.name} ${x.qty}${o.unit}`).join(' / ');}
// 選べる選択肢：定番の一覧＋依頼に入っているもの
function optionChoices(o){
  const u=usualItems.find(x=>x.id===o.usualId);
  return[...new Set([...(u?usualOptList(u):[]),...o.items.map(x=>x.name)])];
}
// 依頼時に増やした選択肢を、定番にも保存して次回から選べるようにする
function saveNewOptionsToUsual(usualId,names){
  const u=usualItems.find(x=>x.id===usualId);
  if(!u)return;
  const list=usualOptList(u);
  const added=names.filter(n=>!list.includes(n));
  if(!added.length)return;
  u.optionList=JSON.stringify([...list,...added]);
  apiPost({action:'updateUsualItem',id:String(usualId),fields:{optionList:u.optionList}}).catch(e=>showErr('選択肢の保存に失敗: '+e.message));
}

/* チェックボックス＋数量の行 */
// 同じ品物がすでに依頼・発注されている数量（2重発注の防止用）。{選択肢名:{req,ord}}
function requestedStatus(itemName){
  const st={};
  pending.filter(i=>i.name===itemName).forEach(i=>{
    const o=parseOptions(i);
    if(!o)return;
    o.items.forEach(x=>{
      st[x.name]=st[x.name]||{req:0,ord:0,unit:o.unit};
      st[x.name][i.orderedAt?'ord':'req']+=x.qty;
    });
  });
  recentBought(itemName).forEach(({item,date})=>{
    const o=parseOptions(item);
    if(!o)return;
    o.items.forEach(x=>{
      st[x.name]=st[x.name]||{req:0,ord:0,unit:o.unit};
      st[x.name].rec=(st[x.name].rec||0)+x.qty;
      if(!st[x.name].recDate||date>st[x.name].recDate)st[x.name].recDate=date;
    });
  });
  return st;
}
// 直近に購入した同じ品物（届いた直後の2重発注を防ぐため）
const RECENT_BOUGHT_DAYS=7;
function parseDateLoose(s){
  const m=String(s||'').match(/(\d{4})[年\/-](\d{1,2})[月\/-](\d{1,2})/);
  const d=m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])):new Date(s);
  return isNaN(d.getTime())?null:d;
}
function recentBought(itemName){
  const limit=new Date();
  limit.setHours(0,0,0,0);
  limit.setDate(limit.getDate()-RECENT_BOUGHT_DAYS);
  return done.filter(i=>i.name===itemName)
    .map(item=>({item,date:parseDateLoose(item.boughtAt)}))
    .filter(x=>x.date&&x.date>=limit);
}
function monthDay(d){return`${d.getMonth()+1}/${d.getDate()}`;}
function optStatusHTML(s){
  if(!s)return'';
  return(s.req?`<span class="opt-status">依頼中 ${s.req}${esc(s.unit)}</span>`:'')
    +(s.ord?`<span class="opt-status ordered">発注済み・到着待ち ${s.ord}${esc(s.unit)}</span>`:'')
    +(s.rec?`<span class="opt-status recent">最近購入 ${s.rec}${esc(s.unit)}（${monthDay(s.recDate)}）</span>`:'');
}
// 色などの選択肢が無い依頼の重複表示
function dupBannerHTML(itemName){
  const dup=pending.filter(i=>i.name===itemName&&!parseOptions(i));
  const rec=recentBought(itemName).filter(x=>!parseOptions(x.item));
  if(!dup.length&&!rec.length)return'';
  const lines=[
    ...dup.map(i=>`${i.orderedAt?'発注済み・到着待ち':'依頼中'} ${esc(i.qty||'個数未記入')}${i.requester?`（${esc(i.requester)}）`:''}`),
    ...rec.map(x=>`最近購入 ${esc(x.item.qty||'個数未記入')}（${monthDay(x.date)}）`),
  ];
  return`<div class="dup-banner">⚠ 重複していないか確認してください<br>${lines.join('<br>')}</div>`;
}
function optRowHTML(name,qty,unit,req,status){
  const on=qty>0;
  return`<div class="opt-row${on?'':' off'}" data-name="${esc(name)}" data-req="${req||''}">
    <label><input type="checkbox" class="chk" ${on?'checked':''} onchange="optCheck(this)"><span>${esc(name)}</span>${optStatusHTML(status)}</label>
    <div class="opt-qty">
      <button type="button" class="opt-step" onclick="optStep(this,-1)">−</button>
      <input type="number" inputmode="numeric" min="0" value="${on?qty:''}" oninput="optTyped(this)">
      <button type="button" class="opt-step" onclick="optStep(this,1)">＋</button>
      <span>${esc(unit)}${req?` / ${req}${esc(unit)}`:''}</span>
    </div>
  </div>`;
}
function optRowsHTML(p,label,unit,choices,selected,canAdd=true,statusOf=null){
  const status=statusOf?requestedStatus(statusOf):{};
  return`<div class="form-row">
    <label>${esc(label)}と数量を選択 <span class="req">*</span></label>
    <div id="${p}-opt-rows" data-unit="${esc(unit)}">${choices.map(n=>optRowHTML(n,selected[n]||0,unit,0,status[n])).join('')}</div>
    ${canAdd?`<div class="opt-new">
      <input type="text" id="${p}-opt-new" placeholder="${esc(label)}を追加">
      <button type="button" onclick="optAddRow('${p}')">＋追加</button>
    </div>`:''}
  </div>`;
}
function optSetRow(row,qty){
  row.querySelector('input[type=number]').value=qty>0?qty:'';
  row.querySelector('input[type=checkbox]').checked=qty>0;
  row.classList.toggle('off',!(qty>0));
  row.parentElement?.classList.remove('invalid');
}
function optCheck(chk){
  const row=chk.closest('.opt-row');
  optSetRow(row,chk.checked?(parseInt(row.querySelector('input[type=number]').value)||parseInt(row.dataset.req)||1):0);
}
// 全行を依頼どおりの数量でチェック
function optCheckAll(p){
  [...document.getElementById(p+'-opt-rows').children].forEach(r=>optSetRow(r,parseInt(r.dataset.req)||1));
}
function optStep(btn,d){
  const row=btn.closest('.opt-row');
  optSetRow(row,Math.max(0,(parseInt(row.querySelector('input[type=number]').value)||0)+d));
}
function optTyped(inp){
  const row=inp.closest('.opt-row');
  const on=(parseInt(inp.value)||0)>0;
  row.querySelector('input[type=checkbox]').checked=on;
  row.classList.toggle('off',!on);
}
function optAddRow(p){
  const inp=document.getElementById(p+'-opt-new');
  const name=(inp.value||'').trim();
  if(!name)return;
  const box=document.getElementById(p+'-opt-rows');
  const same=[...box.children].find(r=>r.dataset.name===name);
  if(same)optSetRow(same,Math.max(1,parseInt(same.querySelector('input[type=number]').value)||0));
  else box.insertAdjacentHTML('beforeend',optRowHTML(name,1,box.dataset.unit));
  inp.value='';
}
function readOptRows(p){
  const newInp=document.getElementById(p+'-opt-new');
  if(newInp&&newInp.value.trim())optAddRow(p); // 追加ボタンを押し忘れた入力も取り込む
  return[...document.getElementById(p+'-opt-rows').children].map(r=>({
    name:r.dataset.name,
    qty:r.querySelector('input[type=checkbox]').checked?(parseInt(r.querySelector('input[type=number]').value)||0):0
  })).filter(x=>x.qty>0);
}

/* カードの「＋追加」：依頼中の選択肢と数量を変更 */
function openOptionsModal(id){
  const item=pending.find(i=>i.id===id);
  const o=parseOptions(item);
  if(!o)return;
  const selected=Object.fromEntries(o.items.map(x=>[x.name,x.qty]));
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">${esc(item.name)}：${esc(o.label)}を変更</div>
      ${optRowsHTML('om',o.label,o.unit,optionChoices(o),selected)}
      <button class="submit-btn" onclick="saveOptionsModal('${id}')">💾 保存する</button>
    </div>
  </div>`;
}
async function saveOptionsModal(id){
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const o=parseOptions(pending[idx]);
  const items=readOptRows('om');
  if(warnRequired([[!items.length,'om-opt-rows',o.label+'と数量']]))return;
  const fields={qty:optTotal(items,o.unit),options:optionsJSON(o,items)};
  const old=pending[idx];
  pending[idx]={...old,...fields};
  saveNewOptionsToUsual(o.usualId,items.map(x=>x.name));
  closeModal();
  if(mode==='staff')renderStaff();else renderAdmin();
  showToast('変更しました ✓');
  try{await apiPost({action:'updateItem',id:String(id),fields,sheet:'pending'});}
  catch(e){pending[idx]=old;if(mode==='staff')renderStaff();else renderAdmin();showErr('更新失敗: '+e.message);}
}

function openOptionBuyModal(id){
  const item=pending.find(i=>i.id===id);
  const o=parseOptions(item);
  if(!o)return;
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">🛍 買えた${esc(o.label)}と数量</div>
      <div style="background:#eef4fb;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#2a3f5f"><strong>${esc(item.name)}</strong>　依頼 ${esc(item.qty)}</div>
      <button type="button" class="small-btn" style="margin-bottom:6px;padding:7px 12px" onclick="optCheckAll('ob')">すべて買えた</button>
      <div id="ob-opt-rows" data-unit="${esc(o.unit)}">${o.items.map(x=>optRowHTML(x.name,0,o.unit,x.qty)).join('')}</div>
      <div style="font-size:12px;color:#a3702a;margin:10px 0">足りない分は買い残しとして要購入に残ります</div>
      <button class="submit-btn" onclick="confirmOptionBuy('${id}')">購入済みにする</button>
    </div>
  </div>`;
}
async function confirmOptionBuy(id){
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const src=pending[idx];
  const o=parseOptions(src);
  const bought=readOptRows('ob');
  if(warnRequired([[!bought.length,'ob-opt-rows','買えた'+o.label+'と数量']]))return;
  const rest=o.items.map(x=>{
    const b=bought.find(y=>y.name===x.name);
    return{name:x.name,qty:x.qty-(b?b.qty:0)};
  }).filter(x=>x.qty>0);
  const boughtAt=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const boughtQty=optTotal(bought,o.unit);
  const boughtOptions=optionsJSON(o,bought);
  const doneItem={...src,boughtAt,requestedQty:src.qty,boughtQty,qty:boughtQty,options:boughtOptions};
  closeModal();
  if(rest.length){
    const remainingQty=optTotal(rest,o.unit),remainingOptions=optionsJSON(o,rest);
    pending[idx]={...src,qty:remainingQty,options:remainingOptions,partial:'1'};
    done.unshift(doneItem);
    renderAdmin();showToast(`${boughtQty}購入済み・残り${remainingQty}を要購入に残しました`);
    try{await apiPost({action:'partialBuy',id:String(id),boughtAt,boughtQty,requestedQty:src.qty,remainingQty,boughtOptions,remainingOptions});}
    catch(e){pending[idx]=src;done.shift();renderAdmin();showErr('失敗: '+e.message);}
  }else{
    pending.splice(idx,1);
    done.unshift(doneItem);
    renderAdmin();showToast('全数購入済みにしました ✓');
    try{await apiPost({action:'moveToDone',id:String(id),boughtAt,boughtQty,requestedQty:src.qty,options:boughtOptions});}
    catch(e){pending.splice(idx,0,src);done.shift();renderAdmin();showErr('失敗: '+e.message);}
  }
}

function renderUsualTab(){
  const items=usualItems;
  const usualKeyFn=(key,i)=>key==='place'?(i.place||'場所未定'):key==='cat'?getCatLabel(i.cat||'zappi'):'';
  function usualGrouped(items,s1,s2){
    if(!items.length)return'<div class="empty"><span class="empty-icon">📦</span>登録された定番アイテムはありません</div>';
    const card=i=>`
      <div class="item-card">
        <div class="img-col">
          ${imgSlotHTML(i,'usualItems')}
          <div style="display:flex;gap:4px">
            <button class="icon-btn" onclick="openUsualEditModal('${i.id}')" title="編集">✏️</button>
            <button class="icon-btn" onclick="deleteUsualItem('${i.id}','${esc(i.name)}')">🗑</button>
          </div>
        </div>
        <div class="item-info">
          <div class="item-name">⭐ ${esc(i.name)}</div>
          <div class="item-qty" style="margin-top:1px">${i.qty?`× ${esc(i.qty)}`:''}</div>
          <div class="item-meta">
            <span class="cat-badge ${getCatClass(i.cat)}">${getCatLabel(i.cat||'zappi')}</span>
            ${i.place?`<span>📍${esc(i.place)}</span>`:''}
          </div>
          ${i.optionLabel?`<div class="opt-pills">${usualOptList(i).map(n=>`<span class="opt-pill">${esc(n)}</span>`).join('')}</div>`:''}
          ${i.memo?`<div style="font-size:12px;color:#5a8ab8;margin-top:2px">${esc(i.memo)}</div>`:''}
        </div>
        <div class="actions-col" style="justify-content:center">
          <button class="buy-btn usual-go-btn" onclick="openUsualSendModal('${i.id}')">購入依頼<br>へ進む</button>
        </div>
      </div>`;
    if(s1==='none'){return items.map(card).join('');}
    const g1={};
    items.forEach(i=>{const k=usualKeyFn(s1,i);if(!g1[k])g1[k]=[];g1[k].push(i);});
    const g1Keys=sortGroupKeysGeneric(Object.keys(g1),s1);
    return g1Keys.map(k1=>{

      if(s2==='none'||s2===s1){inner=its1.map(card).join('');}

        const g2Keys=sortGroupKeysGeneric(Object.keys(g2),s2);

          ${g2[k2].map(card).join('')}</div>`).join('');

      return`<div class="group-block"><div class="group-label">${s1==='place'?'📍':s1==='cat'?'💰':''} ${esc(k1)}<span style="font-size:11px;color:#8ab0cc;font-weight:400;margin-left:4px">${its1.length}件</span></div>${inner}</div>`;
    }).join('');
  }

  return`${sortBar2('usualSort1','usualSort2')}
  <div class="section" style="padding-top:8px">
    ${usualGrouped(items,usualSort1,usualSort2)}
    <button class="submit-btn" style="margin-top:12px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4)" onclick="toggleUsualAddForm()">＋ 新しい定番アイテムを登録</button>

        <label>品名 <span class="req">*</span></label>
        <input type="text" id="u-name" placeholder="例: 絵の具セット">
      </div>
      ${usualOptFieldsHTML('u',null)}
      <div class="form-row" id="u-qty-row">
        <label>個数 <span class="opt">(任意・毎回変えられます)</span></label>
        <input type="text" id="u-qty" placeholder="例: 2個">
      </div>
      <div class="form-row">
        <label>経費の種類</label>
        <select id="u-cat">${CATS.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}</select>

        <label>購入場所 <span class="opt">(任意)</span></label>

          <option value="">未定</option>
          ${allPlaces().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>フォルダ <span class="opt">(任意)</span></label>

        </select>

        <label>画像 <span class="opt">(任意)</span></label>
        <div class="img-area" id="u-img-area">
          <div class="img-area-text">📷 タップして選択</div>
        </div>
        <input type="file" id="u-img" accept="image/*">
        <div class="img-preview-box" id="u-img-preview-box">

  if(id&&idx<0){closeModal();return;}
  let imgFields={};
  showLoading('保存中…');
  try{imgFields=await imgFieldsFromForm('ue-img-preview');}
  catch(e){hideLoading();showErr('画像の保存に失敗: '+e.message);return;}

function closeModal(){document.getElementById('modal-container').innerHTML='';}
async function saveEdit(id){
  const name=(document.getElementById('e-name').value||'').trim();
  const itemOpt=parseOptions(pending.find(i=>i.id===id));
  const optItems=itemOpt?readOptRows('e'):null;
  const qty=itemOpt?(optItems.length?optTotal(optItems,itemOpt.unit):''):(document.getElementById('e-qty').value||'').trim();
  if(warnRequired([
    [!name,'e-name','品名'],
    itemOpt?[!qty,'e-opt-rows',itemOpt.label+'と数量']:[!qty,'e-qty','個数'],
  ]))return;
  let place=document.getElementById('e-place').value;
  if(place==='__new__')place=(document.getElementById('e-place-new').value||'').trim();
  const url=(document.getElementById('e-url').value||'').trim();
  const memo=(document.getElementById('e-memo').value||'').trim();
  const folder=document.getElementById('e-folder')?.value||'';
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  let imgFields={};
  showLoading('保存中…');
  try{imgFields=await imgFieldsFromForm('e-img-preview');}
  catch(e){hideLoading();showErr('画像の保存に失敗: '+e.message);return;}
  hideLoading();
  const oldItem={...pending[idx]};
  const fields={name,qty,place,url,memo,folder,...imgFields};
  if(itemOpt){
    fields.options=optionsJSON(itemOpt,optItems);
    saveNewOptionsToUsual(itemOpt.usualId,optItems.map(x=>x.name));
  }
  pending[idx]={...pending[idx],...fields};
  if('img' in imgFields)delete pending[idx].imgBig;
  if(place&&!masterPlaces.includes(place)&&!['ダイソー','セリア','ドラッグストア','ホームセンター','文房具店','Amazon'].includes(place))masterPlaces.push(place);
  closeModal();
  showToast('訂正しました ✓');
  staffTab='mylist';renderStaff();
  try{
    await apiPost({action:'updateItem',id:String(id),fields});
  }catch(e){pending[idx]=oldItem;renderStaff();showErr('更新失敗: '+e.message);}
}

async function deleteFolder(e,folderId,folderName){
  e.stopPropagation();
  if(!confirm(`「${folderName}」を削除しますか？
フォルダ内のアイテムは「通常」に戻ります。`))return;
  const idx=folders.findIndex(f=>f.id===folderId);

function filterByFolder(items){
  if(currentFolder==='all') return items;
  if(currentFolder==='') return items.filter(i=>!i.folder||i.folder==='');
  return items.filter(i=>i.folder===currentFolder);
}

function sortGroupKeysGeneric(keys,sortKey){
  if(sortKey!=='place')return keys.sort();
  const order=allPlaces();
  return keys.sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(a==='場所未定')return 1;
    if(b==='場所未定')return -1;
    if(ia<0&&ib<0)return a.localeCompare(b,'ja');
    if(ia<0)return 1;
    if(ib<0)return -1;
    return ia-ib;
  });
}

function groupedCards(items,s1,s2,cardOpts){
  if(!items.length)return'';
  const keyFn=(key,i)=>key==='place'?(i.place||'場所未定'):key==='cat'?getCatLabel(i.cat||'zappi'):key==='requester'?(i.requester||'不明'):'';
  const card=i=>itemCardHTML(i,cardOpts);
  if(s1==='date'||s1==='none'){
    return[...items].sort((a,b)=>Number(b.id)-Number(a.id)).map(card).join('');
  }
  let html='';
  const g1={};
  items.forEach(i=>{const k=keyFn(s1,i);if(!g1[k])g1[k]=[];g1[k].push(i);});
  const g1Keys=sortGroupKeysGeneric(Object.keys(g1),s1);
  g1Keys.forEach(k1=>{
    const its1=g1[k1];
    let inner='';
    if(s2==='none'||s2===s1){
      inner=its1.map(card).join('');
    } else if(s2==='date'){
      inner=[...its1].sort((a,b)=>Number(b.id)-Number(a.id)).map(card).join('');
    } else {
      const g2={};
      its1.forEach(i=>{const k=keyFn(s2,i);if(!g2[k])g2[k]=[];g2[k].push(i);});
      const g2Keys=sortGroupKeysGeneric(Object.keys(g2),s2);
      inner=g2Keys.map(k2=>{
        const its2=g2[k2];
        return `
        <div style="margin-left:8px;margin-bottom:10px">
          <div class="group-label" style="font-size:10px;opacity:.8">${grpIcon(s2)} ${esc(k2)}<span style="font-size:10px;color:#8ab0cc;font-weight:400;margin-left:4px">${its2.length}件</span></div>
          ${its2.map(card).join('')}
        </div>`;
      }).join('');
    }
    html+=`<div class="group-block"><div class="group-label">${grpIcon(s1)} ${esc(k1)}<span style="font-size:11px;color:#8ab0cc;font-weight:400;margin-left:4px">${its1.length}件</span></div>${inner}</div>`;
  });
  return html;
}

async function addMasterItem(type){
  const inputId=type==='requester'?'new-requester':'new-place';
  const val=(document.getElementById(inputId)?.value||'').trim();
  if(!val){showToast('名前を入力してください');return;}
  if(type==='requester'&&masterRequesters.includes(val)){showToast('すでに登録されています');return;}
  if(type==='place'&&masterPlaces.includes(val)){showToast('すでに登録されています');return;}
  if(type==='requester') masterRequesters.push(val);
  else masterPlaces.push(val);
  renderAdmin();
  showToast('追加しました');
  try{await apiPost({action:'saveMasterDirect',masterType:type,value:val,garden:currentGarden});}
  catch(e){showErr('追加失敗: '+e.message);}
}

async function addFolderFromMaster(){
  const val=(document.getElementById('new-folder')?.value||'').trim();
  if(!val){showToast('フォルダ名を入力してください');return;}
  const newFolder={id:String(Date.now()),name:val,garden:currentGarden};
  folders.push(newFolder);
  renderAdmin();
  showToast('フォルダを追加しました');
  try{await apiPost({action:'addFolder',name:val,garden:currentGarden});}
  catch(e){folders.pop();renderAdmin();showErr('フォルダ作成失敗: '+e.message);}
}

async function deleteFolderFromMaster(folderId,folderName){
  if(!confirm('「'+folderName+'」を削除しますか？\nフォルダ内のアイテムは「通常」に戻ります。'))return;
  const idx=folders.findIndex(f=>f.id===folderId);
  if(idx<0)return;
  folders.splice(idx,1);
  pending.forEach(i=>{if(i.folder===folderId)i.folder='';});
  done.forEach(i=>{if(i.folder===folderId)i.folder='';});
  hold.forEach(i=>{if(i.folder===folderId)i.folder='';});
  if(currentFolder===folderId)currentFolder='';
  renderAdmin();
  showToast('フォルダを削除しました');
  try{await apiPost({action:'deleteFolder',folderId,garden:currentGarden});}
  catch(e){showErr('削除失敗: '+e.message);loadAll().then(()=>renderAdmin());}
}

function makeReorderable(containerId, type){
  const container=document.getElementById(containerId);
  if(!container)return;
  let dragEl=null;

  container.querySelectorAll('.master-row').forEach(row=>{
    const handle=row.querySelector('.drag-handle');
    if(!handle)return;
    handle.onpointerdown=(e)=>{
      e.preventDefault();
      dragEl=row;
      row.classList.add('dragging');
      try{handle.setPointerCapture(e.pointerId);}catch(err){}
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp,{once:true});
    };
  });

  function onMove(e){
    if(!dragEl)return;
    const rows=[...container.querySelectorAll('.master-row')];
    const y=e.clientY;
    for(const row of rows){
      if(row===dragEl)continue;
      const rect=row.getBoundingClientRect();
      if(y>rect.top&&y<rect.bottom){
        const mid=rect.top+rect.height/2;
        if(y<mid){
          if(row.previousElementSibling!==dragEl)container.insertBefore(dragEl,row);
        }else{
          if(row.nextElementSibling!==dragEl)container.insertBefore(dragEl,row.nextElementSibling);
        }
        break;
      }
    }
  }

  function onUp(){
    if(!dragEl)return;
    dragEl.classList.remove('dragging');
    document.removeEventListener('pointermove',onMove);
    const newOrder=[...container.querySelectorAll('.master-row')].map(r=>r.dataset.value);
    dragEl=null;
    if(type)saveMasterOrder(type,newOrder);
  }
}

async function saveMasterOrder(type,newOrder){
  if(type==='usual'){
    usualItems=newOrder.map(id=>usualItems.find(u=>u.id===id)).filter(Boolean);
    try{await apiPost({action:'reorderUsualItems',ids:newOrder});}
    catch(e){showErr('並び順の保存に失敗: '+e.message);}
    return;
  }
  if(type==='folder'){
    await saveFolderOrder(newOrder);
    return;
  }
  if(type==='requester')masterRequesters=newOrder;
  else masterPlaces=newOrder;
  try{
    await apiPost({action:'reorderMaster',masterType:type,garden:currentGarden,values:newOrder});
  }catch(e){
    showErr('並び順の保存に失敗: '+e.message);
  }
}

async function saveFolderOrder(newOrderIds){
  // newOrderIdsはフォルダIDの新しい順番
  const reordered=newOrderIds.map(id=>folders.find(f=>f.id===id)).filter(Boolean);
  folders=reordered;
  try{
    await apiPost({action:'reorderFolders',garden:currentGarden,folderIds:newOrderIds});
  }catch(e){
    showErr('フォルダ並び順の保存に失敗: '+e.message);
  }
}

/* ── 定番マスタの並び順（表示だけ変える。手動の順番は保存したまま） ─── */
let usualMasterSort='manual';
function sortedUsualForMaster(){
  if(usualMasterSort==='manual')return usualItems;
  const byName=(a,b)=>String(a.name).localeCompare(String(b.name),'ja');
  const rank=(order,v)=>{const i=order.indexOf(v);return i<0?order.length:i;};
  const places=allPlaces(),cats=CATS.map(c=>c.id);
  return[...usualItems].sort((a,b)=>{
    // 同じグループが必ず隣り合うように、マスタに無い場所は名前順、未定は最後にする
    if(usualMasterSort==='place'){
      const pr=u=>u.place?rank(places,u.place):places.length+1;
      return pr(a)-pr(b)||String(a.place||'').localeCompare(String(b.place||''),'ja')||byName(a,b);
    }
    if(usualMasterSort==='cat')return rank(cats,a.cat||'zappi')-rank(cats,b.cat||'zappi')||String(a.cat||'').localeCompare(String(b.cat||''))||byName(a,b);
    return byName(a,b);
  });
}

/* ── マスタの名前の修正 ─── */
const MASTER_EDIT_LABELS={requester:'依頼者',place:'購入場所',folder:'フォルダ'};
function masterEditCurrent(type,idx){
  return type==='requester'?masterRequesters[idx]:type==='place'?masterPlaces[idx]:folders[idx]?.name;
}
function openMasterEditModal(type,idx){
  const current=masterEditCurrent(type,idx);
  if(!current)return;
  const label=MASTER_EDIT_LABELS[type];
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">✏️ ${label}を修正</div>
      <div class="form-row">
        <label>${label}の名前 <span class="req">*</span></label>
        <input type="text" id="me-name" value="${esc(current)}">
      </div>
      <div style="font-size:12px;color:#5a8a9c;margin-bottom:12px">${type==='folder'
        ?'このフォルダに入っている品物はそのままです。'
        :'この園の依頼中・保留・購入履歴'+(type==='place'?'・定番':'')+'の名前も一緒に変わります。すでにある名前にすると、1つにまとまります。'}</div>
      <button class="submit-btn" onclick="saveMasterEdit('${type}',${idx})">💾 保存する</button>
    </div>
  </div>`;
}
async function saveMasterEdit(type,idx){
  const oldValue=masterEditCurrent(type,idx);
  const newValue=(document.getElementById('me-name').value||'').trim();
  if(warnRequired([[!newValue,'me-name','名前']]))return;
  if(newValue===oldValue){closeModal();return;}
  if(type==='folder'){
    const folder=folders[idx];
    folder.name=newValue;
    closeModal();renderAdmin();showToast('修正しました ✓');
    try{
      const res=await apiPost({action:'renameFolder',folderId:folder.id,name:newValue});
      if(res&&res.error)throw new Error(res.error);
    }catch(e){folder.name=oldValue;renderAdmin();showErr('修正失敗: '+e.message);}
    return;
  }
  const list=type==='requester'?masterRequesters:masterPlaces;
  if(list.includes(newValue)&&!confirm(`「${newValue}」はすでにあります。1つにまとめますか？`))return;
  // 楽観的更新：マスタと、読み込み済みの依頼・履歴・定番の名前を書き換える
  const rename=l=>l.includes(newValue)?l.filter(v=>v!==oldValue):l.map(v=>v===oldValue?newValue:v);
  if(type==='requester')masterRequesters=rename(masterRequesters);
  else{masterPlaces=rename(masterPlaces);masterNetPlaces=rename(masterNetPlaces);}
  const lists=type==='place'?[pending,done,hold,usualItems]:[pending,done,hold];
  lists.forEach(l=>l.forEach(i=>{if(i[type]===oldValue)i[type]=newValue;}));
  closeModal();renderAdmin();showToast('修正しました ✓');
  try{
    const res=await apiPost({action:'renameMaster',masterType:type,oldValue,newValue,garden:currentGarden});
    if(res&&res.error)throw new Error(res.error);
  }catch(e){
    showErr('修正失敗: '+e.message);
    loadAll().then(()=>renderAdmin());
  }
}

function deleteMasterByIdx(btn){
  const type=btn.dataset.type;
  const idx=parseInt(btn.dataset.idx);
  const value=type==='requester'?masterRequesters[idx]:masterPlaces[idx];
  if(!value)return;
  deleteMaster(type,value);
}

async function deleteMaster(type, value){
  if(!confirm(`「${value}」を削除しますか？`))return;
  showLoading('削除中…');
  try{
    await apiPost({action:'deleteMaster',masterType:type,value,garden:currentGarden});
    if(type==='place'&&masterNetPlaces.includes(value)){
      await apiPost({action:'deleteMaster',masterType:'netPlace',value,garden:currentGarden});
    }
    await loadAll();
    showToast(`「${value}」を削除しました`);
    renderAdmin();
  }catch(e){showErr('削除失敗: '+e.message);}
  finally{hideLoading();}
}

function isNetPlace(p){return DEFAULT_NET_PLACES.includes(p)||masterNetPlaces.includes(p);}
async function setOrderedAt(id,orderedAt,msg){
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0)return;
  const old=pending[idx].orderedAt||'';
  pending[idx]={...pending[idx],orderedAt};
  renderAdmin();showToast(msg);
  try{await apiPost({action:'updateItem',id:String(id),fields:{orderedAt},sheet:'pending'});}
  catch(e){pending[idx]={...pending[idx],orderedAt:old};renderAdmin();showErr('失敗: '+e.message);}
}
function orderDate(){return new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});}
function plainQtyParts(item){
  const m=String(item.qty||'').match(/(\d+)/);
  return{num:m?parseInt(m[1]):0,unit:String(item.qty||'').replace(/\d+/,'').trim()||'個'};
}
// 発注：1個だけの品物はそのまま発注済みに。複数あるときは発注できた数量を聞く
function openOrderModal(id){
  const item=pending.find(i=>i.id===id);
  if(!item)return;
  const o=parseOptions(item);
  const {num,unit}=plainQtyParts(item);
  if(!o&&num<=1){setOrderedAt(id,orderDate(),'発注済みにしました');return;}
  const rows=o?o.items.map(x=>optRowHTML(x.name,0,o.unit,x.qty)).join(''):optRowHTML(item.name,0,unit,num);
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">📦 発注できた数量</div>
      <div style="background:#eef4fb;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:#2a3f5f"><strong>${esc(item.name)}</strong>　依頼 ${esc(item.qty)}</div>
      <button type="button" class="small-btn" style="margin-bottom:6px;padding:7px 12px" onclick="optCheckAll('od')">すべて発注できた</button>
      <div id="od-opt-rows" data-unit="${esc(o?o.unit:unit)}">${rows}</div>
      <div style="font-size:12px;color:#a3702a;margin:10px 0">発注できなかった分は依頼中のカードとして残ります</div>
      <button class="submit-btn" onclick="confirmOrder('${id}')">発注済みにする</button>
    </div>
  </div>`;
}
async function confirmOrder(id){
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const src=pending[idx];
  const o=parseOptions(src);
  const ordered=readOptRows('od');
  if(warnRequired([[!ordered.length,'od-opt-rows','発注できた数量']]))return;
  let orderedFields,restFields=null;
  if(o){
    const rest=o.items.map(x=>{
      const b=ordered.find(y=>y.name===x.name);
      return{name:x.name,qty:x.qty-(b?b.qty:0)};
    }).filter(x=>x.qty>0);
    orderedFields={qty:optTotal(ordered,o.unit),options:optionsJSON(o,ordered)};
    if(rest.length)restFields={qty:optTotal(rest,o.unit),options:optionsJSON(o,rest),partial:'1'};
  }else{
    const {num,unit}=plainQtyParts(src);
    const n=ordered[0].qty;
    orderedFields={qty:n+unit};
    if(n<num)restFields={qty:(num-n)+unit,partial:'1'};
  }
  closeModal();
  const orderedAt=orderDate();
  if(!restFields){
    pending[idx]={...src,...orderedFields};
    await setOrderedAt(id,orderedAt,'発注済みにしました');
    if(o||orderedFields.qty!==src.qty)apiPost({action:'updateItem',id:String(id),fields:orderedFields,sheet:'pending'}).catch(e=>showErr('更新失敗: '+e.message));
    return;
  }
  // 一部だけ発注：発注済みのカードを新しく作り、元のカードは残りの数量にする
  const orderedItem={...src,...orderedFields,id:String(Date.now()),orderedAt,partial:''};
  pending[idx]={...src,...restFields};
  pending.splice(idx,0,orderedItem);
  renderAdmin();
  showToast(`${orderedFields.qty}発注済み・残り${restFields.qty}は依頼中のままです`);
  try{
    await apiPost({action:'addPending',item:orderedItem});
    await apiPost({action:'updateItem',id:String(id),fields:restFields,sheet:'pending'});
  }catch(e){
    showErr('失敗: '+e.message);
    loadAll().then(()=>renderAdmin());
  }
}
function cancelOrder(id){
  if(!confirm('発注済みを取り消しますか？'))return;
  setOrderedAt(id,'','発注を取り消しました');
}
async function toggleNetPlace(btn){
  const value=masterPlaces[parseInt(btn.dataset.idx)];
  if(!value)return;
  const on=masterNetPlaces.includes(value);

  renderAdmin();
  try{await apiPost({action:on?'deleteMaster':'saveMasterDirect',masterType:'netPlace',value,garden:currentGarden});}
  catch(e){
    masterNetPlaces=on?[...masterNetPlaces,value]:masterNetPlaces.filter(p=>p!==value);
    renderAdmin();showErr('更新失敗: '+e.message);
  }
}

async function confirmPartialBuy(id, originalNum, originalQty){
  const boughtNum=window._drumValue||originalNum;
  if(boughtNum<=0){showToast('1以上の数を入力してください');return;}
  const remaining=originalNum-boughtNum;
  const boughtAt=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const srcItem=pending[idx];
  const unit=String(originalQty).replace(/\d+/,'').trim()||'個';

  // 購入済みアイテム（依頼数・購入数を両方保持）
  const doneItem={
    ...srcItem,
    boughtAt,
    requestedQty:originalQty,
    boughtQty:`${boughtNum}${unit}`,
    qty:`${boughtNum}${unit}`
  };

  if(remaining>0){
    // 残りを要購入に残す（個数更新・買い残しフラグを付与）
    pending[idx]={...srcItem,qty:`${remaining}${unit}`,partial:'1'};
    done.unshift(doneItem);
    closeModal();
    renderAdmin();
    showToast(`${boughtNum}${unit}購入済み・残り${remaining}${unit}を要購入に残しました`);
    try{
      await apiPost({action:'partialBuy',id:String(id),boughtAt,
        boughtQty:`${boughtNum}${unit}`,requestedQty:originalQty,
        remainingQty:`${remaining}${unit}`});
    }catch(e){
      // ロールバック
      pending[idx]=srcItem;done.shift();
      renderAdmin();showErr('失敗: '+e.message);
    }
  } else {
    // 全数購入
    pending.splice(idx,1);
    done.unshift(doneItem);
    closeModal();
    renderAdmin();
    showToast('全数購入済みにしました ✓');
    try{
      await apiPost({action:'moveToDone',id:String(id),boughtAt,
        boughtQty:`${boughtNum}${unit}`,requestedQty:originalQty});
    }catch(e){
      pending.splice(idx,0,srcItem);done.shift();
      renderAdmin();showErr('失敗: '+e.message);
    }
  }
}

/* ── 下スワイプでリロード（Pull to Refresh） ── */
function setupPullToRefresh(){
  const indicator=document.getElementById('pull-refresh-indicator');
  const spin=document.getElementById('pull-refresh-spin');
  const text=document.getElementById('pull-refresh-text');
  const THRESHOLD=70;
  let startY=0,startX=0,pulling=false,refreshing=false,lastPull=0;

  document.addEventListener('touchstart',e=>{
    if(refreshing)return;
    if(window.scrollY>0||document.documentElement.scrollTop>0)return;
    startY=e.touches[0].clientY;
    startX=e.touches[0].clientX;
    pulling=true;
    lastPull=0;
  },{passive:true});

  document.addEventListener('touchmove',e=>{
    if(!pulling||refreshing)return;
    const dy=e.touches[0].clientY-startY;
    const dx=e.touches[0].clientX-startX;
    if(Math.abs(dx)>Math.abs(dy)){pulling=false;return;} // 横スワイプは無視（フォルダバー等）
    if(dy>0&&(window.scrollY||0)===0){
      const pull=Math.min(dy,110);
      lastPull=pull;
      indicator.style.transform=`translateX(-50%) translateY(${pull-50}px)`;
      indicator.style.opacity=Math.min(pull/THRESHOLD,1);
      text.textContent=pull>=THRESHOLD?'離すと更新':'引っ張って更新';
    }
  },{passive:true});

  document.addEventListener('touchend',async()=>{
    if(!pulling)return;
    pulling=false;
    if(lastPull>=THRESHOLD){
      refreshing=true;
      text.textContent='更新中…';
      spin.classList.add('active');
      indicator.style.transform='translateX(-50%) translateY(14px)';
      indicator.style.opacity='1';
      try{
        await loadAll();
        if(mode==='staff'){renderStaff();}else{renderAdmin();}
      }catch(e){/* エラーは通常のloadAll内で表示済み */}
      spin.classList.remove('active');
      indicator.style.transform='translateX(-50%) translateY(-50px)';
      indicator.style.opacity='0';
      refreshing=false;
    } else {
      indicator.style.transform='translateX(-50%) translateY(-50px)';
      indicator.style.opacity='0';
    }
    lastPull=0;
  },{passive:true});
}
