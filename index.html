<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>買出しリクエスト画面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:15px;color:#2a4a55;background:#e8f0f5;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;background:#e8f0f5;min-height:100vh}
.header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 12px;border-bottom:1px solid #b8d8e8;background:#8fb8c8;position:sticky;top:0;z-index:10;gap:6px}
.header-garden{font-size:15px;font-weight:700;color:#fff;text-align:center;padding:4px 8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-garden:hover{opacity:.8}
.header-left{display:flex;justify-content:flex-start}
.header-right{display:flex;justify-content:flex-end}
.mode-btn{font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;font-weight:500}
.mode-btn:hover{background:rgba(255,255,255,.2)}
.mode-btn.active{background:#fff;color:#5a8a9c;border-color:#fff;font-weight:700}
.header-side-btn{font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.5);border-radius:20px;background:transparent;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;font-weight:500}
.header-side-btn:hover{background:rgba(255,255,255,.2)}
.header-side-btn.active{background:#fff;color:#5a8a9c;border-color:#fff;font-weight:700}
.loading-overlay{position:fixed;inset:0;background:rgba(249,246,240,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:12px}
.spinner{width:36px;height:36px;border:3px solid #e8f0f2;border-top-color:#8fb8c8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#5a8a9c}
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{flex:1;padding:9px 4px;font-size:13px;font-weight:600;border:none;border-radius:12px;background:#d4e6ee;color:#5a8a9c;cursor:pointer;text-align:center;white-space:nowrap}
.tab.active{background:#8fb8c8;color:#fff;box-shadow:0 1px 6px rgba(143,184,200,.3)}
.section{padding:14px 16px}
.form-card{background:#fffdf8;border:1px solid #e8f0f2;border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(143,184,200,.1)}
.form-row{margin-bottom:12px}
.form-row:last-child{margin-bottom:0}
label{display:block;font-size:12px;color:#5a8a9c;margin-bottom:4px}
.req{color:#c0664a}
.opt{font-size:11px;color:#a8c4cc}
input[type=text],input[type=url],input[type=number],select,textarea{width:100%;border:1px solid #d4e6ec;border-radius:10px;padding:9px 11px;font-size:14px;background:#fbf9f2;color:#2a4a55;outline:none;-webkit-appearance:none;appearance:none}
input[type=text]:focus,input[type=url]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:#8fb8c8;background:#fff}
textarea{resize:vertical;min-height:60px}
.sub-input{margin-top:6px;display:none}
.submit-btn{width:100%;padding:12px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);border:none;border-radius:12px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;margin-top:4px}
.submit-btn:hover{opacity:.9}
.submit-btn:active{transform:scale(.99)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.img-area{border:2px dashed #c8dfe6;border-radius:12px;padding:12px;background:#fbf9f2;text-align:center;cursor:pointer;transition:border-color .2s}
.img-area:hover,.img-area.drag-over{border-color:#8fb8c8;background:#eef6f8}
.img-area-text{font-size:13px;color:#a8c4cc;pointer-events:none}
.img-preview-box{position:relative;display:none;margin-top:8px}
.img-preview-box img{width:100%;max-height:130px;object-fit:cover;border-radius:10px;display:block}
.img-clear-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;border:none;cursor:pointer;font-size:13px;line-height:22px;text-align:center}
input[type=file]{display:none}
.sort-bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 16px 0}
.sort-label{font-size:11px;color:#5a8a9c;margin-bottom:3px}
.sort-bar select{font-size:13px;padding:6px 10px}
.group-block{margin-bottom:16px}
.group-label{font-size:11px;font-weight:700;color:#5a8a9c;letter-spacing:.06em;margin-bottom:7px;display:flex;align-items:center;gap:5px}
.item-card{background:#fffdf8;border:1px solid #e8f0f2;border-radius:12px;padding:11px 12px;display:flex;align-items:stretch;gap:10px;margin-bottom:8px;box-shadow:0 1px 6px rgba(143,184,200,.08)}
.item-card.done{}
.chk{width:22px;height:22px;flex-shrink:0;cursor:pointer;margin-top:2px;accent-color:#8fb8c8;align-self:flex-start}
.img-slot{width:48px;height:48px;flex-shrink:0;border-radius:10px;overflow:hidden;background:#e3eef2;border:1px solid #d4e6ec;display:flex;align-items:center;justify-content:center;align-self:flex-start}
.img-slot img{width:100%;height:100%;object-fit:cover}
.img-slot-empty{font-size:18px;opacity:.35;color:#5a8a9c}
.item-info{flex:1;min-width:0}
.item-name{font-size:14px;font-weight:700;color:#2a4a55;word-break:break-all}
.item-name.done{}
.item-qty{font-size:14px;font-weight:700;color:#2a4a55;margin-top:1px}
.item-qty.done{}
.item-meta{font-size:12px;color:#5a8a9c;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.icon-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid #e8f0f2;border-radius:8px;background:transparent;cursor:pointer;color:#a8c4cc;font-size:16px;flex-shrink:0}
.icon-btn:hover{background:#eef6f8;color:#5a8a9c}
.actions-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;justify-content:space-between;gap:4px}
.small-btn{font-size:11px;padding:4px 9px;border:none;border-radius:8px;background:#e3eef2;color:#5a8a9c;cursor:pointer;white-space:nowrap;font-weight:600}
.small-btn:hover{background:#d4e6ec}
.edit-btn{font-size:12px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:48px;text-align:center;line-height:1.3}
.edit-btn:hover{opacity:.85}
.hold-btn{font-size:12px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#8fb8c8,#6fa0b4);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:48px;text-align:center;line-height:1.3}
.hold-btn:hover{opacity:.85}
.rebuy-btn{font-size:13px;padding:10px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#d4937a,#c47a5f);color:#fff;cursor:pointer;white-space:nowrap;font-weight:700;min-width:52px;text-align:center;line-height:1.3}
.rebuy-btn:hover{opacity:.85}
.revert-btn{font-size:11px;padding:4px 9px;border:none;border-radius:8px;background:#e3eef2;color:#5a8a9c;cursor:pointer;white-space:nowrap;font-weight:600}
.revert-btn:hover{background:#d4e6ec}
.cat-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.bc-kyozai{background:#d8e8ee;color:#3a7a92}
.bc-shoumou{background:#d0e8d8;color:#1a6a40}
.bc-kyushoku{background:#f0ddc8;color:#a3602a}
.bc-cake{background:#f0ddd0;color:#a3603f}
.bc-torig{background:#e6e2d4;color:#6a6858}
.bc-diy{background:#c8e8dc;color:#0a6a50}
.bc-zappi{background:#e2dce8;color:#5a4a70}
.bc-fukuri{background:#fce8d8;color:#a35a20}
.requester-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#f0e6d8;color:#9a7a55;font-weight:500}
.qty-alert{font-size:12px;font-weight:700;color:#c0664a}
.cat-select-inline{border:1px solid #c8dfe6;border-radius:8px;font-size:12px;padding:3px 6px;background:#fbf9f2;color:#2a4a55;width:auto}
.empty{text-align:center;padding:36px 16px;color:#a8c4cc;font-size:13px}
.empty-icon{font-size:36px;display:block;margin-bottom:8px}
.url-link{font-size:11px;color:#6fa0b4;word-break:break-all;text-decoration:none}
.url-link:hover{text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#8fb8c8;color:#fff;font-size:13px;padding:10px 22px;border-radius:20px;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;z-index:200;box-shadow:0 4px 16px rgba(143,184,200,.35)}
.toast.show{opacity:1}
.err-banner{background:#fbe8e2;border:1px solid #e0b09c;border-radius:10px;padding:10px 14px;margin:10px 16px 0;font-size:13px;color:#a3502f;display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(42,74,85,.45);z-index:150;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fffdf8;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto}
.modal-title{font-size:15px;font-weight:700;color:#8fb8c8;margin-bottom:14px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:#a8c4cc;line-height:1}
/* ドラムロールピッカー */
.drum-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:8px 0}
.drum-unit-input{width:70px;border:1px solid #d4e6ec;border-radius:10px;padding:8px;font-size:15px;text-align:center;background:#fbf9f2;color:#2a4a55}
.drum-picker{position:relative;width:240px;height:130px;overflow:hidden;border-radius:12px;border:1px solid #d4e6ec;background:#fbf9f2;cursor:grab;margin:0 auto}
.drum-picker::before,.drum-picker::after{content:'';position:absolute;left:0;right:0;height:42px;z-index:2;pointer-events:none}
.drum-picker::before{top:0;background:linear-gradient(to bottom,rgba(249,246,240,.95),rgba(249,246,240,0))}
.drum-picker::after{bottom:0;background:linear-gradient(to top,rgba(249,246,240,.95),rgba(249,246,240,0))}
.drum-highlight{position:absolute;top:50%;left:0;right:0;height:42px;transform:translateY(-50%);border-top:2px solid #8fb8c8;border-bottom:2px solid #8fb8c8;border-radius:4px;pointer-events:none;z-index:1}
.drum-list{position:absolute;top:0;left:0;right:0;transition:transform .15s cubic-bezier(.25,.46,.45,.94)}
.drum-item{height:42px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#a8c4cc;user-select:none}
.drum-item.selected{color:#8fb8c8;font-size:26px}
.drum-label{font-size:12px;color:#5a8a9c;text-align:center;margin-top:2px}
/* 画像拡大ライトボックス */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:lb-in .2s ease}
@keyframes lb-in{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain;transition:transform .05s linear;will-change:transform}
.lightbox-close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(255,255,255,.3)}

/* 園選択オーバーレイ */
.garden-overlay{position:fixed;inset:0;background:#f9f6f0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.garden-overlay h2{font-size:20px;font-weight:700;color:#2a4a55;margin-bottom:8px;text-align:center}
.garden-overlay p{font-size:13px;color:#5a8a9c;margin-bottom:32px;text-align:center}
.garden-btn{width:100%;max-width:340px;padding:16px;margin-bottom:12px;border:2px solid #d4e6ec;border-radius:16px;background:#fff;font-size:16px;font-weight:600;color:#2a4a55;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(143,184,200,.1);transition:all .15s}
.garden-btn:hover{border-color:#8fb8c8;background:#eef6f8;transform:translateX(4px)}
.garden-btn .g-icon{font-size:24px}
.garden-badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:#e3eef2;color:#5a8a9c;font-weight:600;margin-left:8px;vertical-align:middle}

/* フォルダタブ */
.folder-bar{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
.folder-bar::-webkit-scrollbar{display:none}
.folder-chip{font-size:12px;padding:5px 14px;border-radius:20px;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;font-weight:500;background:#d4e6ee;color:#5a8a9c}
.folder-chip.active{background:#8fb8c8;color:#fff;font-weight:700}
.folder-chip.add-btn{background:#fff;border:1.5px dashed #8fb8c8;color:#5a8a9c}
.folder-chip.add-btn:hover{background:#eef6f8}
.folder-del{font-size:10px;margin-left:4px;opacity:.7;cursor:pointer}
.folder-del:hover{opacity:1}

.action-bar{display:flex;gap:6px;padding:8px 16px;align-items:center;background:#d4e6ee;border-bottom:1px solid #b8d4e4;flex-wrap:wrap}
.action-bar-btn{font-size:12px;padding:5px 14px;border:none;border-radius:20px;cursor:pointer;font-weight:600;white-space:nowrap}
.sel-count{font-size:12px;color:#2a4a55;font-weight:600;flex:1}
.csv-btn{background:#e3eef2;color:#3a7a9c;border:1px solid #b8d4e4}
.csv-btn:hover{background:#d4e6ee}
.move-folder-btn{background:#e3eef2;color:#3a7a9c;border:1px solid #b8d4e4}
.move-folder-btn:hover{background:#d4e6ee}
.clear-sel-btn{background:#fff;color:#5a8a9c;border:1px solid #b8d4e4}
.clear-sel-btn:hover{background:#eef6f8}
.buy-btn{font-size:13px;padding:26px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#e88fa8,#d4607a);color:#fff;cursor:pointer;font-weight:700;text-align:center;line-height:1.4;width:48px;display:flex;align-items:center;justify-content:center}
.buy-btn:hover{opacity:.85}
</style>
</head>
<body>
<div id="garden-overlay" class="garden-overlay" style="display:none">
  <div style="font-size:48px;margin-bottom:16px">🛒</div>
  <h2>買出しリクエスト</h2>
  <p>使用する園を選択してください</p>
  <button class="garden-btn" onclick="selectGarden('西新こども保育園')"><span class="g-icon">🌸</span>西新こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('原こども保育園')"><span class="g-icon">🌿</span>原こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('たの津こども保育園')"><span class="g-icon">🌊</span>たの津こども保育園</button>
  <button class="garden-btn" onclick="selectGarden('ちくし野こども保育園')"><span class="g-icon">🌾</span>ちくし野こども保育園</button>
</div>
<div class="app">
  <div class="header">
    <div class="header-left">
      <button class="header-side-btn" id="staff-btn" onclick="goStaff()">リクエスト画面</button>
    </div>
    <div class="header-garden" id="header-garden" onclick="changeGarden()">園を選択してください</div>
    <div class="header-right">
      <button class="mode-btn" id="mode-toggle" onclick="goAdmin()">買出し画面</button>
    </div>
  </div>
  <div id="err-banner" class="err-banner"></div>
  <div id="staff-view"></div>
  <div id="admin-view" style="display:none"></div>
  <div id="modal-container"></div>
  <div class="toast" id="toast"></div>
  <div class="loading-overlay" id="loading" style="display:none">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">読み込み中…</div>
  </div>
</div>

<script>
const APP_VERSION='2026-07-10-02'; // 更新時にこの値を変えると新バージョン検知に使えます
const GAS_URL='https://script.google.com/macros/s/AKfycbygPEd4lQT2YPtNSolSbp7HhBD7ATbXzUrWU0HCBsSsY-jKUAP6w72K_kXU2yGeRkmkWQ/exec';
let currentGarden=localStorage.getItem('kaidashi_garden')||'';
let folders=[];
let selectedItems=new Set(); // 選択中のアイテムID
let currentFolder=''; // ''=通常（全フォルダ外）、'all'=全て表示、フォルダID=特定フォルダ
const CATS=[
  {id:'kyozai',label:'保育教材費'},
  {id:'shoumou',label:'消耗品'},
  {id:'kyushoku',label:'給食費'},
  {id:'cake',label:'誕生日ケーキ'},
  {id:'torig',label:'トリグ（お米）'},
  {id:'diy',label:'DIY'},
  {id:'fukuri',label:'福利厚生費'},
  {id:'zappi',label:'雑費'},
];
const DEFAULT_PLACES=['ダイソー','セリア','ドラッグストア','ホームセンター','文房具店','Amazon'];

let pending=[],done=[],masterRequesters=[],masterPlaces=[];
let mode='staff',staffTab='request',adminTab='pending';
let sortKey1='place',sortKey2='cat';
let hold=[];
let holdSort1='date',holdSort2='none';
let staffListSort1='date',staffListSort2='none';
let doneSort1='date',doneSort2='none';
let filterCat='all',filterPlace='all';

/* ── ローディング ─── */
function showLoading(msg='処理中…'){document.getElementById('loading-text').textContent=msg;document.getElementById('loading').style.display='flex';}
function hideLoading(){document.getElementById('loading').style.display='none';}
function showErr(msg){const b=document.getElementById('err-banner');b.textContent='!! '+msg;b.style.display='block';setTimeout(()=>b.style.display='none',6000);}
function showGardenOverlay(){
  document.getElementById('garden-overlay').style.display='flex';
}
function hideGardenOverlay(){
  document.getElementById('garden-overlay').style.display='none';
}
function selectGarden(name){
  const prev=currentGarden;
  currentGarden=name;
  localStorage.setItem('kaidashi_garden',name);
  hideGardenOverlay();
  updateGardenHeader();
  // 園が変わったらデータを再読み込み
  if(prev!==name){
    pending=[];done=[];hold=[];masterRequesters=[];masterPlaces=[];
    staffTab='request';adminTab='pending';
    if(mode==='staff')renderStaff();else renderAdmin();
    loadAll().then(()=>{
      if(mode==='staff')renderStaff();else renderAdmin();
    });
  }
}
function updateGardenHeader(){
  const el=document.getElementById('header-garden');
  if(el) el.textContent=currentGarden||'園を選択してください';
  const staffBtn=document.getElementById('staff-btn');
  const adminBtn=document.getElementById('mode-toggle');
  if(staffBtn){
    staffBtn.classList.toggle('active', mode==='staff');
  }
  if(adminBtn){
    adminBtn.classList.toggle('active', mode==='admin');
  }
}
function changeGarden(){
  showGardenOverlay();
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}

/* ── API ─── */
async function apiGet(){
  const res=await fetch(GAS_URL+'?action=getAll&garden='+encodeURIComponent(currentGarden)+'&t='+Date.now(),{redirect:'follow'});
  return JSON.parse(await res.text());
}
async function apiPost(payload){
  const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  const text=await res.text();
  try{return JSON.parse(text);}catch(e){console.error('Parse error:',text);throw new Error('レスポンスの解析に失敗');}
}
async function loadAll(silent=false){
  if(!silent)showLoading('データを読み込み中…');
  try{
    const d=await apiGet();
    pending=d.pending||[];done=d.done||[];hold=d.hold||[];folders=d.folders||[];
    masterRequesters=d.masters?.requesters||[];masterPlaces=d.masters?.places||[];
  }catch(e){console.error(e);if(!silent)showErr('読み込み失敗: '+e.message);}
  finally{if(!silent)hideLoading();renderModeBtn();}
}

/* ── ユーティリティ ─── */
function getCatLabel(id){const c=CATS.find(c=>c.id===id);return c?c.label:id}
function getCatClass(id){return'bc-'+(id||'zappi')}
function allPlaces(){return[...DEFAULT_PLACES,...masterPlaces.filter(p=>!DEFAULT_PLACES.includes(p))]}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtDate(s){
  if(!s)return'';
  const d=new Date(s);
  if(isNaN(d.getTime())){
    // "2026/5/22"や"2026年5月22日"形式をパース
    const m=String(s).match(/(\d{4})[^\d](\d{1,2})[^\d](\d{1,2})/);
    if(!m)return s;
    const d2=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    if(isNaN(d2.getTime()))return s;
    return d2.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  }
  return d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}
function shortUrl(u){try{const x=new URL(u);return x.hostname+(x.pathname.length>1?x.pathname.slice(0,20)+'…':'');}catch{return String(u).slice(0,28)+'…'}}

function exportCSV(){
  const items=filterByFolder(pending);
  if(!items.length){showToast('出力するアイテムがありません');return;}
  const folderName=currentFolder==='all'?'すべて':currentFolder===''?'通常':getFolderName_safe();
  const headers=['品名','個数','経費','購入場所','依頼者','メモ','URL','依頼日'];
  const NL=String.fromCharCode(10);
  const q=v=>'"'+String(v||'').replace(/"/g,'""')+'"';
  const headerRow=headers.map(q).join(',');
  const dataRows=items.map(i=>[i.name,i.qty,getCatLabel(i.cat||'zappi'),i.place,i.requester,i.memo,i.url,fmtDate(i.created)].map(q).join(','));
  const csv='\uFEFF'+[headerRow,...dataRows].join(NL);
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const d=new Date().toLocaleDateString('ja-JP');
  a.download='買出しリスト_'+currentGarden+'_'+folderName+'_'+d+'.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSVをダウンロードしました');
}
function getFolderName_safe(){
  if(!currentFolder)return '通常';
  const f=folders.find(f=>f.id===currentFolder);
  return f?f.name:'不明';
}

  let arr=pending, arrName='pending';

  if(idx<0)return;
  const oldPlace=arr[idx].place;
  arr[idx]={...arr[idx],place:newPlace};

  renderAdmin();
  const action=arrName==='pending'?'updateItem':arrName==='done'?'updateDoneItem':'updateHoldItem';

}

/* ════ 画像ヘルパー ════ */
function setupImgArea(areaId,inputId,previewBoxId,previewImgId){
  const area=document.getElementById(areaId);
  const input=document.getElementById(inputId);
  if(!area||!input)return;
  area.addEventListener('click',()=>input.click());
  area.addEventListener('dragover',e=>{e.preventDefault();area.classList.add('drag-over');});
  area.addEventListener('dragleave',()=>area.classList.remove('drag-over'));
  area.addEventListener('drop',e=>{e.preventDefault();area.classList.remove('drag-over');const f=e.dataTransfer.files[0];if(f)loadImgFile(f,previewBoxId,previewImgId);});
  // クリップボードペースト（ページ全体で受け取る）
  document.addEventListener('paste',e=>{
    if(!document.getElementById(areaId))return;
    const items=e.clipboardData?.items;
    if(!items)return;
    for(const item of items){if(item.type.startsWith('image/')){loadImgFile(item.getAsFile(),previewBoxId,previewImgId);break;}}
  });
  input.addEventListener('change',()=>{if(input.files[0])loadImgFile(input.files[0],previewBoxId,previewImgId);});
}
function loadImgFile(file,previewBoxId,previewImgId){
  const reader=new FileReader();
  reader.onload=e=>{
    compressImage(e.target.result, 800, 0.7, compressed=>{
      const box=document.getElementById(previewBoxId);
      const img=document.getElementById(previewImgId);
      if(box&&img){img.src=compressed;box.style.display='block';}
    });
  };
  reader.readAsDataURL(file);
}

function compressImage(dataUrl, maxSize, quality, callback){
  const img=new Image();
  img.onload=()=>{
    let w=img.width, h=img.height;
    if(w>maxSize||h>maxSize){
      if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}
      else{w=Math.round(w*maxSize/h);h=maxSize;}
    }
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    callback(canvas.toDataURL('image/jpeg',quality));
  };
  img.src=dataUrl;
}
function clearImg(previewBoxId,previewImgId,inputId){
  const box=document.getElementById(previewBoxId);const img=document.getElementById(previewImgId);const inp=document.getElementById(inputId);
  if(box)box.style.display='none';if(img)img.src='';if(inp)inp.value='';
}
function getImgData(previewImgId){
  const img=document.getElementById(previewImgId);
  return(img&&img.src&&img.src.startsWith('data:'))?img.src:'';
}

  const qty=(document.getElementById('rb-qty').value||'').trim();

  const src=done.find(i=>i.id===srcId);
  if(!src)return;
  const newItem={...src,id:String(Date.now()),garden:currentGarden,requester,qty,place,memo,
                 created:new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'})};

  // mastersも即時更新

  }catch(e){

}

async function saveEdit(id){
  const name=(document.getElementById('e-name').value||'').trim();
  const qty=(document.getElementById('e-qty').value||'').trim();
  if(!name||!qty){showToast('品名・個数は必須です');return;}
  let place=document.getElementById('e-place').value;
  if(place==='__new__')place=(document.getElementById('e-place-new').value||'').trim();
  const url=(document.getElementById('e-url').value||'').trim();
  const memo=(document.getElementById('e-memo').value||'').trim();
  const img=getImgData('e-img-preview');
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const oldItem={...pending[idx]};
  const fields={name,qty,place,url,memo,img};
  pending[idx]={...pending[idx],...fields};
  if(place&&!masterPlaces.includes(place)&&!['ダイソー','セリア','ドラッグストア','ホームセンター','文房具店','Amazon'].includes(place))masterPlaces.push(place);
  closeModal();
  showToast('訂正しました ✓');
  staffTab='mylist';renderStaff();
  try{await apiPost({action:'updateItem',id:String(id),fields});}
  catch(e){pending[idx]=oldItem;renderStaff();showErr('更新失敗: '+e.message);}
}

function filterByFolder(items){
  if(currentFolder==='all') return items;
  if(currentFolder==='') return items.filter(i=>!i.folder||i.folder==='');
  return items.filter(i=>i.folder===currentFolder);
}

function groupedCards(items,s1,s2,cardOpts){
  if(!items.length)return'';
  const keyFn=(key,i)=>key==='place'?(i.place||'場所未定'):key==='cat'?getCatLabel(i.cat||'zappi'):key==='requester'?(i.requester||'不明'):'';
  const card=i=>itemCardHTML(i,cardOpts);
  if(s1==='date'||s1==='none'){
    return[...items].sort((a,b)=>Number(b.id)-Number(a.id)).map(card).join('');
  }
  let html='';
  const g1={};
  items.forEach(i=>{const k=keyFn(s1,i);if(!g1[k])g1[k]=[];g1[k].push(i);});
  Object.entries(g1).forEach(([k1,its1])=>{
    let inner='';
    if(s2==='none'||s2===s1){
      inner=its1.map(card).join('');
    } else if(s2==='date'){
      inner=[...its1].sort((a,b)=>Number(b.id)-Number(a.id)).map(card).join('');
    } else {
      const g2={};
      its1.forEach(i=>{const k=keyFn(s2,i);if(!g2[k])g2[k]=[];g2[k].push(i);});
      inner=Object.entries(g2).map(([k2,its2])=>`
        <div style="margin-left:8px;margin-bottom:10px">
          <div class="group-label" style="font-size:10px;opacity:.8">${grpIcon(s2)} ${esc(k2)}<span style="font-size:10px;color:#8ab0cc;font-weight:400;margin-left:4px">${its2.length}件</span></div>
          ${its2.map(card).join('')}
        </div>`).join('');
    }
    html+=`<div class="group-block"><div class="group-label">${grpIcon(s1)} ${esc(k1)}<span style="font-size:11px;color:#8ab0cc;font-weight:400;margin-left:4px">${its1.length}件</span></div>${inner}</div>`;
  });
  return html;
}

function renderHoldList(){

async function addMasterItem(type){

  else masterPlaces.push(val);
  renderAdmin();
  showToast('追加しました');
  try{await apiPost({action:'saveMasterDirect',masterType:type,value:val,garden:currentGarden});}
  catch(e){showErr('追加失敗: '+e.message);}

async function addFolderFromMaster(){
  const val=(document.getElementById('new-folder')?.value||'').trim();

  const newFolder={id:String(Date.now()),name:val,garden:currentGarden};

  renderAdmin();
  showToast('フォルダを追加しました');
  try{await apiPost({action:'addFolder',name:val,garden:currentGarden});}
  catch(e){folders.pop();renderAdmin();showErr('フォルダ作成失敗: '+e.message);}

async function deleteFolderFromMaster(folderId,folderName){
  if(!confirm('「'+folderName+'」を削除しますか？\nフォルダ内のアイテムは「通常」に戻ります。'))return;
  const idx=folders.findIndex(f=>f.id===folderId);
  if(idx<0)return;
  folders.splice(idx,1);
  pending.forEach(i=>{if(i.folder===folderId)i.folder='';});
  done.forEach(i=>{if(i.folder===folderId)i.folder='';});
  hold.forEach(i=>{if(i.folder===folderId)i.folder='';});
  if(currentFolder===folderId)currentFolder='';
  renderAdmin();
  showToast('フォルダを削除しました');
  try{await apiPost({action:'deleteFolder',folderId,garden:currentGarden});}
  catch(e){showErr('削除失敗: '+e.message);loadAll().then(()=>renderAdmin());}
}

function deleteMasterByIdx(btn){
  const type=btn.dataset.type;
  const idx=parseInt(btn.dataset.idx);
  const value=type==='requester'?masterRequesters[idx]:masterPlaces[idx];
  if(!value)return;
  deleteMaster(type,value);
}

async function deleteMaster(type, value){
  if(!confirm(`「${value}」を削除しますか？`))return;
  showLoading('削除中…');
  try{
    await apiPost({action:'deleteMaster',masterType:type,value:value});
    await loadAll();
    showToast(`「${value}」を削除しました`);
    renderAdmin();
  }catch(e){showErr('削除失敗: '+e.message);}
  finally{hideLoading();}
}

/* ── 共通カードHTML ─── */
function itemCardHTML(i,opts={}){
  const {checkBox,cancelBtn,editBtn,rebuyBtn,holdBtn,holdToPublicBtn,doneToPublicBtn,deleteBtn,isDone,catEditable,placeEditable}=opts;
  const catBadge=catEditable
    ?`<select class="cat-select-inline" onchange="updateCat('${i.id}',this.value)">${CATS.map(c=>`<option value="${c.id}"${c.id===(i.cat||'zappi')?' selected':''}>${c.label}</option>`).join('')}</select>`
    :`<span class="cat-badge ${getCatClass(i.cat)}">${getCatLabel(i.cat||'zappi')}</span>`;
  const placeBadge=placeEditable
    ?`<div style="display:flex;flex-direction:column;gap:3px">
        <select class="cat-select-inline" id="ps-${i.id}" onchange="onPlaceSelectChange('${i.id}')" style="max-width:130px">
          <option value="">📍 場所未定</option>
          ${allPlaces().map(p=>`<option value="${esc(p)}"${i.place===p?' selected':''}>${esc(p)}</option>`).join('')}
          ${i.place&&!allPlaces().includes(i.place)?`<option value="${esc(i.place)}" selected>${esc(i.place)}</option>`:''}
          <option value="__new__">＋ その他（直接入力）</option>
        </select>
        <input type="text" id="pn-${i.id}" placeholder="購入場所を入力"
          style="display:none;font-size:12px;padding:4px 8px;border:1px solid #c8dfe6;border-radius:8px;background:#fbf9f2;color:#2a4a55;width:130px"
          onblur="onPlaceNewBlur('${i.id}')">
      </div>`
    :(i.place?`<span>📍${esc(i.place)}</span>`:'');
  const imgSlot=`<div class="img-slot">${i.img?`<img src="${esc(i.img)}" alt="" onclick="openLightbox('${esc(i.img)}')" style="cursor:zoom-in">`:`<span class="img-slot-empty">📷</span>`}</div>`;
  return`<div class="item-card${isDone?' done':''}">
    ${checkBox?`<input type="checkbox" class="chk" id="chk-${i.id}" ${selectedItems.has(i.id)?'checked':''} onchange="toggleSelect('${i.id}',this.checked)">`:''}
    ${imgSlot}
    <div class="item-info">
      <div class="item-name-row">
        <div class="item-name${isDone?' done':''}">${esc(i.name)}</div>
        <div class="item-qty${isDone?' done':''}">${
  (isDone&&i.requestedQty&&i.boughtQty&&i.requestedQty!==i.boughtQty)
    ? `依頼 ${esc(i.requestedQty)} → 購入 ${esc(i.boughtQty)}<span style="font-size:11px;color:#e05a7a;margin-left:4px">（残り${String(parseInt(i.requestedQty)||0)-String(parseInt(i.boughtQty)||0)}個）</span>`
    : i.qty?`× ${esc(i.qty)}`:'<span class="qty-alert">個数未記入</span>'
}</div>
      </div>
      <div class="item-meta">
        ${catBadge}
        ${placeEditable?placeBadge:(i.place?`<span>📍${esc(i.place)}</span>`:'')}
      </div>
      <div class="item-meta" style="margin-top:3px">
        ${i.requester?`<span class="requester-tag">👤 ${esc(i.requester)}</span>`:''}
        ${i.garden?`<span style="font-size:11px;padding:2px 8px;border-radius:20px;background:#e3eef2;color:#5a8a9c;font-weight:600">🏫 ${esc(i.garden)}</span>`:''}
      </div>
      ${i.url?`<a class="url-link" href="${esc(i.url)}" target="_blank">🔗 ${shortUrl(i.url)}</a>`:''}
      ${i.memo?`<div style="font-size:12px;color:#5a8ab8;margin-top:2px">${esc(i.memo)}</div>`:''}
      <div style="font-size:11px;color:#8ab0cc;margin-top:3px">${fmtDate(isDone?(i.boughtAt||i.created):i.created)}</div>
    </div>
    <div class="actions-col" style="justify-content:space-between;height:100%">
      <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
        ${cancelBtn?`<button class="small-btn" onclick="cancelItem('${i.id}')">取消</button>`:''}
        ${editBtn?`<button class="edit-btn" onclick="openEditModal('${i.id}')">訂正</button>`:''}
        ${holdBtn?`<button class="hold-btn" onclick="holdItem('${i.id}')">保留</button>`:''}
        ${holdToPublicBtn?`<button class="edit-btn" onclick="holdToPublic('${i.id}')">要購入へ</button>`:''}
        ${doneToPublicBtn?`<button class="revert-btn" onclick="doneToPublic('${i.id}')">要購入へ</button>`:''}
        ${rebuyBtn?`<button class="rebuy-btn" onclick="rebuyItem('${i.id}')">🔄 再購入</button>`:''}
        ${deleteBtn?`<button class="icon-btn" onclick="deleteItem('${i.id}','${isDone?'done':holdToPublicBtn?'hold':'pending'}')">🗑</button>`:''}
      </div>
      ${holdBtn?`<button class="buy-btn" onclick="checkItem('${i.id}',true)">購入</button>`:''}
    </div>
  </div>`;
}

async function holdItem(id){
  if(!confirm('この商品を保留にしますか？'))return;
  const heldAt=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item={...pending[idx],heldAt};
  pending.splice(idx,1);hold.unshift(item);
  renderAdmin();showToast('保留にしました');
  try{await apiPost({action:'moveToHold',id:String(id),heldAt});}
  catch(e){pending.splice(idx,0,item);hold.shift();renderAdmin();showErr('失敗: '+e.message);}
}

async function holdToPublic(id){
  const idx=hold.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item={...hold[idx]};
  hold.splice(idx,1);pending.unshift(item);
  renderAdmin();showToast('要購入に戻しました');
  try{await apiPost({action:'holdToPublic',id:String(id)});}
  catch(e){hold.splice(idx,0,item);pending.shift();renderAdmin();showErr('失敗: '+e.message);}
}

async function doneToPublic(id){
  if(!confirm('購入済みから要購入に戻しますか？'))return;
  const idx=done.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item={...done[idx]};
  done.splice(idx,1);pending.unshift(item);
  renderAdmin();showToast('要購入に戻しました');
  try{await apiPost({action:'doneToPublic',id:String(id)});}
  catch(e){done.splice(idx,0,item);pending.shift();renderAdmin();showErr('失敗: '+e.message);}
}

async function checkItem(id,checked){
  if(!checked)return;
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item=pending[idx];
  const originalQty=item.qty||'';

  // 個数が数値かどうか確認
  const numMatch=String(originalQty).match(/(\d+)/);
  const originalNum=numMatch?parseInt(numMatch[1]):null;

  if(originalNum&&originalNum>1){
    // 一部購入ダイアログ表示
    openPartialBuyModal(id, originalNum, originalQty);
    // チェックボックスを戻す
    const chk=document.querySelector(`input[onchange*="'${id}'"]`);
    if(chk)setTimeout(()=>chk.checked=false,10);
  } else {
    // 1個 or 数値不明 → 通常通り全部購入済みへ
    await moveToDoneFull(id);
  }
}

async function moveToDoneFull(id){
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0)return;
  const boughtAt=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const item={...pending[idx],boughtAt,boughtQty:pending[idx].qty,requestedQty:pending[idx].qty};
  pending.splice(idx,1);done.unshift(item);
  renderAdmin();showToast('購入済にしました ✓');
  try{await apiPost({action:'moveToDone',id:String(id),boughtAt,boughtQty:item.qty,requestedQty:item.qty});}
  catch(e){pending.splice(idx,0,item);done.shift();renderAdmin();showErr('失敗: '+e.message);}
}

function openPartialBuyModal(id, originalNum, originalQty){
  const unit=String(originalQty).replace(/\d+/,'').trim()||'個';
  document.getElementById('modal-container').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-title">🛍 購入数を入力</div>
      <div style="background:#eef4fb;border-radius:10px;padding:10px 12px;margin-bottom:16px;font-size:13px;color:#2a3f5f">
        依頼数：<strong>${originalQty}</strong>
      </div>
      <button class="submit-btn" onclick="buyAllFull('${id}',${originalNum},'${originalQty}')" style="background:linear-gradient(135deg,#6ab87a,#4a9a5a);margin-bottom:14px">✓ 全部購入（${originalQty}）</button>
      <div style="display:flex;align-items:center;gap:10px;margin:12px 0;color:#a8c4cc;font-size:12px">
        <div style="flex:1;height:1px;background:#e8f0f2"></div>
        一部だけ購入した場合
        <div style="flex:1;height:1px;background:#e8f0f2"></div>
      </div>
      <div class="form-row">
        <label style="text-align:center;display:block;margin-bottom:8px">購入できた数</label>
        <div class="drum-wrap">
          <div class="drum-picker" id="drum-picker">
            <div class="drum-highlight"></div>
            <div class="drum-list" id="drum-list"></div>
          </div>
          <div class="drum-label">数量（${unit}）</div>
        </div>
      </div>
      <div style="font-size:13px;color:#4a8ad0;margin:4px 0 16px;text-align:center;font-weight:500" id="remaining-label">
        残り：待機中
      </div>
      <button class="small-btn" onclick="confirmPartialBuy('${id}',${originalNum},'${originalQty}')" style="width:100%;padding:10px;text-align:center;font-size:13px">この数量で購入済みにする</button>
    </div>
  </div>`;
  // ドラムロール初期化（テンプレートリテラルの外で実行）
  setTimeout(()=>initDrum('drum-picker','drum-list', originalNum, 1, originalNum-1, unit), 50);
}

async function buyAllFull(id, originalNum, originalQty){
  window._drumValue = originalNum;
  await confirmPartialBuy(id, originalNum, originalQty);
}

async function confirmPartialBuy(id, originalNum, originalQty){
  const boughtNum=window._drumValue||originalNum;
  if(boughtNum<=0){showToast('1以上の数を入力してください');return;}
  const remaining=originalNum-boughtNum;
  const boughtAt=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  const idx=pending.findIndex(i=>i.id===id);
  if(idx<0){closeModal();return;}
  const srcItem=pending[idx];
  const unit=String(originalQty).replace(/\d+/,'').trim()||'個';

  // 購入済みアイテム（依頼数・購入数を両方保持）
  const doneItem={
    ...srcItem,
    boughtAt,
    requestedQty:originalQty,
    boughtQty:`${boughtNum}${unit}`,
    qty:`${boughtNum}${unit}`
  };

  if(remaining>0){
    // 残りを要購入に残す（個数更新）
    pending[idx]={...srcItem,qty:`${remaining}${unit}`};
    done.unshift(doneItem);
    closeModal();
    renderAdmin();
    showToast(`${boughtNum}${unit}購入済み・残り${remaining}${unit}を要購入に残しました`);
    try{
      await apiPost({action:'partialBuy',id:String(id),boughtAt,
        boughtQty:`${boughtNum}${unit}`,requestedQty:originalQty,
        remainingQty:`${remaining}${unit}`});
    }catch(e){
      // ロールバック
      pending[idx]=srcItem;done.shift();
      renderAdmin();showErr('失敗: '+e.message);
    }
  } else {
    // 全数購入
    pending.splice(idx,1);
    done.unshift(doneItem);
    closeModal();
    renderAdmin();
    showToast('全数購入済みにしました ✓');
    try{
      await apiPost({action:'moveToDone',id:String(id),boughtAt,
        boughtQty:`${boughtNum}${unit}`,requestedQty:originalQty});
    }catch(e){
      pending.splice(idx,0,srcItem);done.shift();
      renderAdmin();showErr('失敗: '+e.message);
    }
  }
}
async function deleteItem(id,list){
  if(!confirm('削除しますか？'))return;
  const arr=list==='pending'?pending:list==='hold'?hold:done;
  const idx=arr.findIndex(i=>i.id===id);
  if(idx<0)return;
  const item=arr[idx];
  arr.splice(idx,1);
  renderAdmin();showToast('削除しました');
  try{await apiPost({action:list==='pending'?'deletePending':list==='hold'?'deleteHold':'deleteDone',id:String(id)});}
  catch(e){arr.splice(idx,0,item);renderAdmin();showErr('失敗: '+e.message);}
}

function startVersionWatcher(){
  setInterval(async()=>{
    try{
      const res=await fetch(window.location.href.split('?')[0]+'?_v='+Date.now(),{cache:'no-store'});
      const text=await res.text();
      const match=text.match(/APP_VERSION='([^']+)'/);
      if(match&&match[1]&&match[1]!==APP_VERSION){
        console.log('新しいバージョンを検出:',match[1],'→ リロードします');
        location.reload(true);
      }
    }catch(e){/* オフライン時などは無視 */}
  }, 5*60*1000); // 5分ごと
}

/* ── ライトボックス（ピンチ拡縮対応） ── */
function openLightbox(src){
  const lb=document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML=`<div class="lightbox-close" id="lb-close">✕</div><img src="${src}" alt="" id="lb-img" style="touch-action:none;cursor:zoom-in;user-select:none">`;
  document.body.appendChild(lb);

  const img=document.getElementById('lb-img');
  const closeBtn=document.getElementById('lb-close');
  let scale=1, minScale=0.5, maxScale=8;
  let translateX=0, translateY=0;
  let lastTX=0, lastTY=0;
  // ピンチ用
  let pinching=false, initDist=0, initScale=1;
  let pinchMidX=0, pinchMidY=0, initTX=0, initTY=0;
  // ドラッグ用
  let dragging=false, dragStartX=0, dragStartY=0;
  let lastTap=0;

  function applyTransform(animate){
    img.style.transition=animate?'transform .2s ease':'none';
    img.style.transform=`translate(${translateX}px,${translateY}px) scale(${scale})`;
  }
  function getDist(t){
    return Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  }
  function getMid(t){
    return {x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2};
  }

  lb.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===2){
      pinching=true; dragging=false;
      initDist=getDist(e.touches);
      initScale=scale;
      const mid=getMid(e.touches);
      pinchMidX=mid.x; pinchMidY=mid.y;
      initTX=translateX; initTY=translateY;
    } else if(e.touches.length===1){
      dragging=true; pinching=false;
      dragStartX=e.touches[0].clientX-translateX;
      dragStartY=e.touches[0].clientY-translateY;
      // ダブルタップ
      const now=Date.now();
      if(now-lastTap<300){
        if(scale>1){scale=1;translateX=0;translateY=0;lastTX=0;lastTY=0;}
        else{scale=2.5;}
        applyTransform(true);
        dragging=false;
      }
      lastTap=now;
    }
  },{passive:false});

  lb.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(pinching&&e.touches.length===2){
      const dist=getDist(e.touches);
      const newScale=Math.min(maxScale,Math.max(minScale,initScale*(dist/initDist)));
      // ピンチ中心点を基準にズーム
      const mid=getMid(e.touches);
      const dx=mid.x-pinchMidX;
      const dy=mid.y-pinchMidY;
      translateX=initTX+(newScale-initScale)*(pinchMidX-initTX/initScale*0+0)*0+dx;
      translateY=initTY+dy;
      scale=newScale;
      translateX=initTX+dx;
      translateY=initTY+dy;
      applyTransform(false);
    } else if(dragging&&e.touches.length===1){
      translateX=e.touches[0].clientX-dragStartX;
      translateY=e.touches[0].clientY-dragStartY;
      applyTransform(false);
    }
  },{passive:false});

  lb.addEventListener('touchend',e=>{
    e.preventDefault();
    if(e.touches.length===0){
      pinching=false; dragging=false;
      lastTX=translateX; lastTY=translateY;
      // 背景タップで閉じる（移動・拡縮していない時のみ）
    } else if(e.touches.length===1&&pinching){
      pinching=false;
      dragStartX=e.touches[0].clientX-translateX;
      dragStartY=e.touches[0].clientY-translateY;
      dragging=true;
    }
  },{passive:false});

  // PCマウスホイールでズーム
  lb.addEventListener('wheel',e=>{
    e.preventDefault();
    scale=Math.min(maxScale,Math.max(minScale,scale*(e.deltaY<0?1.1:0.9)));
    applyTransform(false);
  },{passive:false});

  // 閉じる（touchendとclickの両方対応）
  closeBtn.addEventListener('touchend',e=>{e.stopPropagation();e.preventDefault();lb.remove();},{passive:false});
  closeBtn.addEventListener('click',e=>{e.stopPropagation();lb.remove();});
  // 背景タップで閉じる（スケール1かつ移動なしの時）
  lb.addEventListener('touchend',e=>{
    if(e.target===lb&&e.changedTouches.length===1&&!pinching){
      lb.remove();
    }
  },{passive:true});
  lb.addEventListener('click',e=>{if(e.target===lb)lb.remove();});
}

/* ── ドラムロール ── */
function initDrum(pickerId, listId, max, initVal, initRemain, unit){
  const list=document.getElementById(listId);
  const picker=document.getElementById(pickerId);
  if(!list||!picker)return;

  const ITEM_H=42;
  const items=[];
  for(let i=1;i<=max;i++)items.push(i);

  // リスト生成（前後にパディング用ダミー）
  const pad=1;
  let innerHtml='';
  for(let p=0;p<pad;p++) innerHtml+=`<div class="drum-item" style="height:${ITEM_H}px"></div>`;
  items.forEach((v,i)=>{ innerHtml+=`<div class="drum-item${v===initVal?' selected':''}" data-val="${v}" style="height:${ITEM_H}px">${v}</div>`; });
  for(let p=0;p<pad;p++) innerHtml+=`<div class="drum-item" style="height:${ITEM_H}px"></div>`;
  list.innerHTML=innerHtml;

  let currentIdx=initVal-1; // 0-indexed
  window._drumValue=initVal;

  function scrollTo(idx, animate){
    idx=Math.max(0,Math.min(items.length-1,idx));
    currentIdx=idx;
    window._drumValue=items[idx];
    const offset=-(idx*ITEM_H);
    list.style.transition=animate?'transform .2s cubic-bezier(.25,.46,.45,.94)':'none';
    list.style.transform=`translateY(${offset}px)`;
    // selected更新
    list.querySelectorAll('.drum-item[data-val]').forEach(el=>{
      el.classList.toggle('selected',parseInt(el.dataset.val)===items[idx]);
    });
    // 残り数更新
    const rem=max-items[idx];
    const unitVal=unit;
    const lbl=document.getElementById('remaining-label');
    if(lbl)lbl.textContent=rem>0?`残り：${rem}${unitVal} → 要購入に残ります`:`全数購入（要購入から削除）`;
  }

  // 初期位置
  scrollTo(initVal-1, false);

  // タッチ・マウスドラッグ
  let startY=0, startIdx=0, dragging=false;

  function onStart(y){startY=y;startIdx=currentIdx;dragging=true;}
  function onMove(y){
    if(!dragging)return;
    const diff=Math.round((startY-y)/ITEM_H);
    scrollTo(startIdx+diff, false);
  }
  function onEnd(){dragging=false;}

  picker.addEventListener('touchstart',e=>{onStart(e.touches[0].clientY);},{passive:true});
  picker.addEventListener('touchmove',e=>{onMove(e.touches[0].clientY);e.preventDefault();},{passive:false});
  picker.addEventListener('touchend',()=>onEnd());
  picker.addEventListener('mousedown',e=>{onStart(e.clientY);});
  window.addEventListener('mousemove',e=>{if(dragging)onMove(e.clientY);});
  window.addEventListener('mouseup',()=>onEnd());

  // ホイール
  picker.addEventListener('wheel',e=>{
    e.preventDefault();
    scrollTo(currentIdx+(e.deltaY>0?1:-1),true);
  },{passive:false});
}
